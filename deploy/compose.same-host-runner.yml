services:
  same-host-runner:
    image: ${SECONDBOX_RUNNER_IMAGE:?set SECONDBOX_RUNNER_IMAGE}
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      control-plane:
        condition: service_healthy
    privileged: true
    network_mode: host
    cgroup: host
    labels:
      org.secondbox.runner.qualification: "not-established-by-compose"
    environment:
      SECONDBOX_RUNNER_ID: ${SECONDBOX_RUNNER_ID:?set SECONDBOX_RUNNER_ID}
      SECONDBOX_COMPUTE_BACKEND: ${SECONDBOX_COMPUTE_BACKEND:?set SECONDBOX_COMPUTE_BACKEND}
      SECONDBOX_RUNNER_POOL_ID: ${SECONDBOX_RUNNER_POOL_ID:?set SECONDBOX_RUNNER_POOL_ID}
      SECONDBOX_RUNNER_SOFTWARE_VERSION: ${SECONDBOX_RUNNER_SOFTWARE_VERSION:?set SECONDBOX_RUNNER_SOFTWARE_VERSION}
      SECONDBOX_RUNNER_CONTROL_PLANE_ADDRESS: ${SECONDBOX_RUNNER_CONTROL_PLANE_ADDRESS:?set SECONDBOX_RUNNER_CONTROL_PLANE_ADDRESS}
      SECONDBOX_RUNNER_CONTROL_PLANE_SERVER_NAME: ${SECONDBOX_RUNNER_CONTROL_PLANE_SERVER_NAME:?set SECONDBOX_RUNNER_CONTROL_PLANE_SERVER_NAME}
      SECONDBOX_RUNNER_CREDENTIAL: ${SECONDBOX_RUNNER_CREDENTIAL:?set SECONDBOX_RUNNER_CREDENTIAL}
      SECONDBOX_RUNNER_CLIENT_CERTIFICATE: /run/secondbox-runner-identity/runner.crt
      SECONDBOX_RUNNER_CLIENT_KEY: /run/secondbox-runner-identity/runner.key
      SECONDBOX_RUNNER_CONTROL_PLANE_CA: /run/secondbox-runner-identity/runner-ca.crt
      SECONDBOX_RUNNER_LOG_PATH: ${SECONDBOX_RUNNER_LOG_PATH:?set SECONDBOX_RUNNER_LOG_PATH}
      SECONDBOX_RUNNER_LOG_DIR: ${SECONDBOX_RUNNER_LOG_DIR:?set SECONDBOX_RUNNER_LOG_DIR}
      SECONDBOX_RUNNER_FIRECRACKER_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_JAILER_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_JAILER_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_JAIL_ROOT: ${SECONDBOX_RUNNER_FIRECRACKER_JAIL_ROOT:?set SECONDBOX_RUNNER_FIRECRACKER_JAIL_ROOT}
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_START: ${SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_START:?set SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_START}
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_COUNT: ${SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_COUNT:?set SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_COUNT}
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_ALLOW_BELOW_1000: ${SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_ALLOW_BELOW_1000:?set SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_ALLOW_BELOW_1000}
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_GID: ${SECONDBOX_RUNNER_FIRECRACKER_JAILER_GID:?set SECONDBOX_RUNNER_FIRECRACKER_JAILER_GID}
      SECONDBOX_RUNNER_FIRECRACKER_CGROUP_VERSION: ${SECONDBOX_RUNNER_FIRECRACKER_CGROUP_VERSION:?set SECONDBOX_RUNNER_FIRECRACKER_CGROUP_VERSION}
      SECONDBOX_RUNNER_FIRECRACKER_CGROUP_PARENT: ${SECONDBOX_RUNNER_FIRECRACKER_CGROUP_PARENT:?set SECONDBOX_RUNNER_FIRECRACKER_CGROUP_PARENT}
      SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_KERNEL_ARGS: ${SECONDBOX_RUNNER_FIRECRACKER_KERNEL_ARGS:?set SECONDBOX_RUNNER_FIRECRACKER_KERNEL_ARGS}
      SECONDBOX_RUNNER_FIRECRACKER_CPU_TEMPLATE: ${SECONDBOX_RUNNER_FIRECRACKER_CPU_TEMPLATE:?set SECONDBOX_RUNNER_FIRECRACKER_CPU_TEMPLATE}
      SECONDBOX_RUNNER_FIRECRACKER_RUN_DIR: ${SECONDBOX_RUNNER_FIRECRACKER_RUN_DIR:?set SECONDBOX_RUNNER_FIRECRACKER_RUN_DIR}
      SECONDBOX_RUNNER_FIRECRACKER_LOG_DIR: ${SECONDBOX_RUNNER_FIRECRACKER_LOG_DIR:?set SECONDBOX_RUNNER_FIRECRACKER_LOG_DIR}
      SECONDBOX_RUNNER_FIRECRACKER_ALLOW_UNJAILED: ${SECONDBOX_RUNNER_FIRECRACKER_ALLOW_UNJAILED:?set SECONDBOX_RUNNER_FIRECRACKER_ALLOW_UNJAILED}
      SECONDBOX_RUNNER_SNAPSHOT_TEMPLATE_CACHE_ROOT: ${SECONDBOX_RUNNER_SNAPSHOT_TEMPLATE_CACHE_ROOT:?set SECONDBOX_RUNNER_SNAPSHOT_TEMPLATE_CACHE_ROOT}
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY: ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY:?set SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY}
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256: ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256:?set SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256}
      SECONDBOX_RUNNER_WORKSPACE_ROOT: ${SECONDBOX_RUNNER_WORKSPACE_ROOT:?set SECONDBOX_RUNNER_WORKSPACE_ROOT}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_RECOVERY_PERCENT: ${SECONDBOX_RUNNER_STORAGE_PRESSURE_RECOVERY_PERCENT:?set SECONDBOX_RUNNER_STORAGE_PRESSURE_RECOVERY_PERCENT}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_WARNING_PERCENT: ${SECONDBOX_RUNNER_STORAGE_PRESSURE_WARNING_PERCENT:?set SECONDBOX_RUNNER_STORAGE_PRESSURE_WARNING_PERCENT}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_ADMISSION_DENY_PERCENT: ${SECONDBOX_RUNNER_STORAGE_PRESSURE_ADMISSION_DENY_PERCENT:?set SECONDBOX_RUNNER_STORAGE_PRESSURE_ADMISSION_DENY_PERCENT}
      SECONDBOX_RUNNER_SANDBOX_MAX_VCPUS: ${SECONDBOX_RUNNER_SANDBOX_MAX_VCPUS:?set SECONDBOX_RUNNER_SANDBOX_MAX_VCPUS}
      SECONDBOX_RUNNER_SANDBOX_MAX_MEMORY_MIB: ${SECONDBOX_RUNNER_SANDBOX_MAX_MEMORY_MIB:?set SECONDBOX_RUNNER_SANDBOX_MAX_MEMORY_MIB}
      SECONDBOX_RUNNER_SANDBOX_MAX_DISK_MIB: ${SECONDBOX_RUNNER_SANDBOX_MAX_DISK_MIB:?set SECONDBOX_RUNNER_SANDBOX_MAX_DISK_MIB}
      SECONDBOX_RUNNER_SANDBOX_MEMORY_BUDGET_MIB: ${SECONDBOX_RUNNER_SANDBOX_MEMORY_BUDGET_MIB:?set SECONDBOX_RUNNER_SANDBOX_MEMORY_BUDGET_MIB}
      SECONDBOX_RUNNER_SANDBOX_GUEST_IP: ${SECONDBOX_RUNNER_SANDBOX_GUEST_IP:?set SECONDBOX_RUNNER_SANDBOX_GUEST_IP}
      SECONDBOX_RUNNER_SANDBOX_BRIDGE_NAME: ${SECONDBOX_RUNNER_SANDBOX_BRIDGE_NAME:?set SECONDBOX_RUNNER_SANDBOX_BRIDGE_NAME}
      SECONDBOX_RUNNER_SANDBOX_BRIDGE_CIDR: ${SECONDBOX_RUNNER_SANDBOX_BRIDGE_CIDR:?set SECONDBOX_RUNNER_SANDBOX_BRIDGE_CIDR}
      SECONDBOX_RUNNER_SANDBOX_GUEST_CIDR: ${SECONDBOX_RUNNER_SANDBOX_GUEST_CIDR:?set SECONDBOX_RUNNER_SANDBOX_GUEST_CIDR}
      SECONDBOX_RUNNER_SANDBOX_TAP_PREFIX: ${SECONDBOX_RUNNER_SANDBOX_TAP_PREFIX:?set SECONDBOX_RUNNER_SANDBOX_TAP_PREFIX}
      SECONDBOX_RUNNER_SANDBOX_NETWORK_STATE_DIR: ${SECONDBOX_RUNNER_SANDBOX_NETWORK_STATE_DIR:?set SECONDBOX_RUNNER_SANDBOX_NETWORK_STATE_DIR}
      SECONDBOX_RUNNER_SANDBOX_DELETE_BRIDGE: ${SECONDBOX_RUNNER_SANDBOX_DELETE_BRIDGE:?set SECONDBOX_RUNNER_SANDBOX_DELETE_BRIDGE}
      SECONDBOX_RUNNER_NETWORK_POLICY_NFT_PATH: ${SECONDBOX_RUNNER_NETWORK_POLICY_NFT_PATH:?set SECONDBOX_RUNNER_NETWORK_POLICY_NFT_PATH}
      SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_PINS: ${SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_PINS:?set SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_PINS}
      SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_TTL: ${SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_TTL:?set SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_TTL}
      SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_ADDRESSES: ${SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_ADDRESSES:?set SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_ADDRESSES}
      SECONDBOX_RUNNER_NETWORK_POLICY_MANAGEMENT_CIDRS: ${SECONDBOX_RUNNER_NETWORK_POLICY_MANAGEMENT_CIDRS:?set SECONDBOX_RUNNER_NETWORK_POLICY_MANAGEMENT_CIDRS}
      SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_GATEWAYS: ${SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_GATEWAYS:?set SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_GATEWAYS}
      SECONDBOX_RUNNER_NETWORK_POLICY_DNS_UPSTREAM: ${SECONDBOX_RUNNER_NETWORK_POLICY_DNS_UPSTREAM:?set SECONDBOX_RUNNER_NETWORK_POLICY_DNS_UPSTREAM}
      SECONDBOX_RUNNER_MAX_CONCURRENT_PER_SANDBOX: ${SECONDBOX_RUNNER_MAX_CONCURRENT_PER_SANDBOX:?set SECONDBOX_RUNNER_MAX_CONCURRENT_PER_SANDBOX}
      SECONDBOX_RUNNER_MAX_CONCURRENT_GLOBAL: ${SECONDBOX_RUNNER_MAX_CONCURRENT_GLOBAL:?set SECONDBOX_RUNNER_MAX_CONCURRENT_GLOBAL}
      SECONDBOX_RUNNER_MAX_CONCURRENT_STARTS: ${SECONDBOX_RUNNER_MAX_CONCURRENT_STARTS:?set SECONDBOX_RUNNER_MAX_CONCURRENT_STARTS}
      SECONDBOX_RUNNER_MAX_CONCURRENT_WORKSPACE_CREATES: ${SECONDBOX_RUNNER_MAX_CONCURRENT_WORKSPACE_CREATES:?set SECONDBOX_RUNNER_MAX_CONCURRENT_WORKSPACE_CREATES}
      SECONDBOX_RUNNER_MAX_CONCURRENT_OPERATIONS_GLOBAL: ${SECONDBOX_RUNNER_MAX_CONCURRENT_OPERATIONS_GLOBAL:?set SECONDBOX_RUNNER_MAX_CONCURRENT_OPERATIONS_GLOBAL}
      SECONDBOX_RUNNER_FILE_TRANSFER_MAX_BYTES: ${SECONDBOX_RUNNER_FILE_TRANSFER_MAX_BYTES:?set SECONDBOX_RUNNER_FILE_TRANSFER_MAX_BYTES}
      SECONDBOX_RUNNER_GUEST_CONTROL_VSOCK_PORT: ${SECONDBOX_RUNNER_GUEST_CONTROL_VSOCK_PORT:?set SECONDBOX_RUNNER_GUEST_CONTROL_VSOCK_PORT}
      SECONDBOX_RUNNER_GUEST_PROTOCOL_VSOCK_PORT: ${SECONDBOX_RUNNER_GUEST_PROTOCOL_VSOCK_PORT:?set SECONDBOX_RUNNER_GUEST_PROTOCOL_VSOCK_PORT}
      SECONDBOX_RUNNER_GUEST_HEARTBEAT_INTERVAL: ${SECONDBOX_RUNNER_GUEST_HEARTBEAT_INTERVAL:?set SECONDBOX_RUNNER_GUEST_HEARTBEAT_INTERVAL}
      SECONDBOX_RUNNER_DATA_PLANE_LISTEN_ADDRESS: ${SECONDBOX_RUNNER_DATA_PLANE_LISTEN_ADDRESS:?set SECONDBOX_RUNNER_DATA_PLANE_LISTEN_ADDRESS}
      SECONDBOX_RUNNER_DATA_PLANE_ADVERTISED_ADDRESS: ${SECONDBOX_RUNNER_DATA_PLANE_ADVERTISED_ADDRESS:?set SECONDBOX_RUNNER_DATA_PLANE_ADVERTISED_ADDRESS}
    devices: [/dev/kvm:/dev/kvm, /dev/net/tun:/dev/net/tun]
    volumes:
      - type: bind
        source: ${SECONDBOX_RUNNER_IDENTITY_HOST_DIR:?set SECONDBOX_RUNNER_IDENTITY_HOST_DIR}
        target: /run/secondbox-runner-identity
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECONDBOX_RUNNER_ARTIFACT_HOST_DIR:?set SECONDBOX_RUNNER_ARTIFACT_HOST_DIR}
        target: /opt/secondbox-artifacts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECONDBOX_RUNNER_STATE_HOST_DIR:?set SECONDBOX_RUNNER_STATE_HOST_DIR}
        target: /var/lib/secondbox-runner
        bind:
          create_host_path: false
          # The reviewed storage root contains state and Workspaces. It must
          # be one bind mount because the Firecracker jailer hard-links the
          # Workspace image into its jail; separate nested binds return EXDEV
          # even when their host paths share one filesystem.
          #
          # rslave, not rshared: the runner creates no mounts meant for the
          # host, and rshared would propagate Runner-private mounts back into
          # the host namespace.
          propagation: rslave
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test: ["CMD", "/usr/local/bin/secondbox-runner", "-healthcheck", "-healthcheck-timeout", "5s"]
      interval: 10s
      timeout: 6s
      retries: 4
      start_period: 15s
