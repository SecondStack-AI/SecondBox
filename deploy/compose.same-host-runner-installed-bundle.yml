# Overlay for a same-host Runner whose manifest sets
# firecracker_installed_bundle = true: it mounts and names the installed signed
# execution bundle that default-image Assignments boot.
services:
  same-host-runner:
    environment:
      SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH}
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY: ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY:?set SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY}
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256: ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256:?set SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256}
    volumes:
      - type: bind
        source: ${SECONDBOX_RUNNER_ARTIFACT_HOST_DIR:?set SECONDBOX_RUNNER_ARTIFACT_HOST_DIR}
        target: /opt/secondbox-artifacts
        read_only: true
        bind:
          create_host_path: false
