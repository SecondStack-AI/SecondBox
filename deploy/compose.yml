name: secondbox

services:
  control-plane:
    image: ${SECONDBOX_CONTROL_PLANE_IMAGE:?set SECONDBOX_CONTROL_PLANE_IMAGE}
    restart: unless-stopped
    depends_on:
      runner-pki-init:
        condition: service_completed_successfully
    environment:
      SECONDBOX_LISTEN_ADDR: ${SECONDBOX_LISTEN_ADDR:?set SECONDBOX_LISTEN_ADDR}
      SECONDBOX_PUBLIC_BASE_URL: ${SECONDBOX_PUBLIC_BASE_URL:?set SECONDBOX_PUBLIC_BASE_URL}
      SECONDBOX_RUNNER_LISTEN_ADDR: ${SECONDBOX_RUNNER_LISTEN_ADDR:?set SECONDBOX_RUNNER_LISTEN_ADDR}
      SECONDBOX_DATABASE_URL: ${SECONDBOX_DATABASE_URL:?set SECONDBOX_DATABASE_URL}
      SECONDBOX_LOG_PATH: ${SECONDBOX_LOG_PATH:?set SECONDBOX_LOG_PATH}
      SECONDBOX_PLATFORM_TOKEN: ${SECONDBOX_PLATFORM_TOKEN:?set SECONDBOX_PLATFORM_TOKEN}
      SECONDBOX_HTTP_TIMEOUT_SECONDS: ${SECONDBOX_HTTP_TIMEOUT_SECONDS:?set SECONDBOX_HTTP_TIMEOUT_SECONDS}
      SECONDBOX_RUNNER_SERVER_CERTIFICATE: ${SECONDBOX_RUNNER_SERVER_CERTIFICATE:?set SECONDBOX_RUNNER_SERVER_CERTIFICATE}
      SECONDBOX_RUNNER_SERVER_PRIVATE_KEY: ${SECONDBOX_RUNNER_SERVER_PRIVATE_KEY:?set SECONDBOX_RUNNER_SERVER_PRIVATE_KEY}
      SECONDBOX_RUNNER_CA_CERTIFICATE: ${SECONDBOX_RUNNER_CA_CERTIFICATE:?set SECONDBOX_RUNNER_CA_CERTIFICATE}
      SECONDBOX_RUNNER_CREDENTIAL: ${SECONDBOX_RUNNER_CREDENTIAL:?set SECONDBOX_RUNNER_CREDENTIAL}
      SECONDBOX_RUNNER_HEARTBEAT_INTERVAL_MILLISECONDS: ${SECONDBOX_RUNNER_HEARTBEAT_INTERVAL_MILLISECONDS:?set SECONDBOX_RUNNER_HEARTBEAT_INTERVAL_MILLISECONDS}
      SECONDBOX_RUNNER_COMMAND_POLL_INTERVAL_MILLISECONDS: ${SECONDBOX_RUNNER_COMMAND_POLL_INTERVAL_MILLISECONDS:?set SECONDBOX_RUNNER_COMMAND_POLL_INTERVAL_MILLISECONDS}
      SECONDBOX_DATA_PLANE_POLL_INTERVAL_MILLISECONDS: ${SECONDBOX_DATA_PLANE_POLL_INTERVAL_MILLISECONDS:?set SECONDBOX_DATA_PLANE_POLL_INTERVAL_MILLISECONDS}
      SECONDBOX_DATA_PLANE_CLAIM_DURATION_MILLISECONDS: ${SECONDBOX_DATA_PLANE_CLAIM_DURATION_MILLISECONDS:?set SECONDBOX_DATA_PLANE_CLAIM_DURATION_MILLISECONDS}
      SECONDBOX_DATA_PLANE_RETENTION_SECONDS: ${SECONDBOX_DATA_PLANE_RETENTION_SECONDS:?set SECONDBOX_DATA_PLANE_RETENTION_SECONDS}
      SECONDBOX_DATA_PLANE_MAXIMUM_FRAME_BYTES: ${SECONDBOX_DATA_PLANE_MAXIMUM_FRAME_BYTES:?set SECONDBOX_DATA_PLANE_MAXIMUM_FRAME_BYTES}
      SECONDBOX_DATA_PLANE_MAXIMUM_SESSION_BYTES: ${SECONDBOX_DATA_PLANE_MAXIMUM_SESSION_BYTES:?set SECONDBOX_DATA_PLANE_MAXIMUM_SESSION_BYTES}
      SECONDBOX_LIFECYCLE_RECONCILE_POLL_INTERVAL_MILLISECONDS: ${SECONDBOX_LIFECYCLE_RECONCILE_POLL_INTERVAL_MILLISECONDS:?set SECONDBOX_LIFECYCLE_RECONCILE_POLL_INTERVAL_MILLISECONDS}
      SECONDBOX_LIFECYCLE_RECONCILE_CLAIM_DURATION_MILLISECONDS: ${SECONDBOX_LIFECYCLE_RECONCILE_CLAIM_DURATION_MILLISECONDS:?set SECONDBOX_LIFECYCLE_RECONCILE_CLAIM_DURATION_MILLISECONDS}
      SECONDBOX_ASSIGNMENT_CLAIM_DURATION_MILLISECONDS: ${SECONDBOX_ASSIGNMENT_CLAIM_DURATION_MILLISECONDS:?set SECONDBOX_ASSIGNMENT_CLAIM_DURATION_MILLISECONDS}
      SECONDBOX_ASSIGNMENT_DEADLINE_MILLISECONDS: ${SECONDBOX_ASSIGNMENT_DEADLINE_MILLISECONDS:?set SECONDBOX_ASSIGNMENT_DEADLINE_MILLISECONDS}
      SECONDBOX_ASSIGNMENT_RETRY_LIMIT: ${SECONDBOX_ASSIGNMENT_RETRY_LIMIT:?set SECONDBOX_ASSIGNMENT_RETRY_LIMIT}
      SECONDBOX_SCHEDULER_SERIALIZATION_RETRY_LIMIT: ${SECONDBOX_SCHEDULER_SERIALIZATION_RETRY_LIMIT:?set SECONDBOX_SCHEDULER_SERIALIZATION_RETRY_LIMIT}
      SECONDBOX_RUNNER_HEARTBEAT_TIMEOUT_MILLISECONDS: ${SECONDBOX_RUNNER_HEARTBEAT_TIMEOUT_MILLISECONDS:?set SECONDBOX_RUNNER_HEARTBEAT_TIMEOUT_MILLISECONDS}
      SECONDBOX_SIGNED_ASSET_CATALOG_PATH: ${SECONDBOX_SIGNED_ASSET_CATALOG_PATH:?set SECONDBOX_SIGNED_ASSET_CATALOG_PATH}
      SECONDBOX_OBJECT_STORE_ENDPOINT: ${SECONDBOX_OBJECT_STORE_ENDPOINT:?set SECONDBOX_OBJECT_STORE_ENDPOINT}
      SECONDBOX_OBJECT_STORE_REGION: ${SECONDBOX_OBJECT_STORE_REGION:?set SECONDBOX_OBJECT_STORE_REGION}
      SECONDBOX_OBJECT_STORE_BUCKET: ${SECONDBOX_OBJECT_STORE_BUCKET:?set SECONDBOX_OBJECT_STORE_BUCKET}
      SECONDBOX_OBJECT_STORE_ROOT_USER: ${SECONDBOX_OBJECT_STORE_ROOT_USER:?set SECONDBOX_OBJECT_STORE_ROOT_USER}
      SECONDBOX_OBJECT_STORE_ROOT_PASSWORD: ${SECONDBOX_OBJECT_STORE_ROOT_PASSWORD:?set SECONDBOX_OBJECT_STORE_ROOT_PASSWORD}
      SECONDBOX_OBJECT_STORE_USE_PATH_STYLE: ${SECONDBOX_OBJECT_STORE_USE_PATH_STYLE:?set SECONDBOX_OBJECT_STORE_USE_PATH_STYLE}
      SECONDBOX_OBJECT_STORE_RETRY_MAX_ATTEMPTS: ${SECONDBOX_OBJECT_STORE_RETRY_MAX_ATTEMPTS:?set SECONDBOX_OBJECT_STORE_RETRY_MAX_ATTEMPTS}
      SECONDBOX_OBJECT_STORE_HTTP_TIMEOUT_MILLISECONDS: ${SECONDBOX_OBJECT_STORE_HTTP_TIMEOUT_MILLISECONDS:?set SECONDBOX_OBJECT_STORE_HTTP_TIMEOUT_MILLISECONDS}
      SECONDBOX_OBJECT_STORE_TEMP_DIRECTORY: ${SECONDBOX_OBJECT_STORE_TEMP_DIRECTORY:?set SECONDBOX_OBJECT_STORE_TEMP_DIRECTORY}
      SECONDBOX_OBJECT_STORE_MAX_OBJECT_BYTES: ${SECONDBOX_OBJECT_STORE_MAX_OBJECT_BYTES:?set SECONDBOX_OBJECT_STORE_MAX_OBJECT_BYTES}
      SECONDBOX_CHECKPOINT_SPOOL_DIRECTORY: ${SECONDBOX_CHECKPOINT_SPOOL_DIRECTORY:?set SECONDBOX_CHECKPOINT_SPOOL_DIRECTORY}
      SECONDBOX_RUNNER_PROTOCOL_MINIMUM: ${SECONDBOX_RUNNER_PROTOCOL_MINIMUM:?set SECONDBOX_RUNNER_PROTOCOL_MINIMUM}
      SECONDBOX_RUNNER_PROTOCOL_MAXIMUM: ${SECONDBOX_RUNNER_PROTOCOL_MAXIMUM:?set SECONDBOX_RUNNER_PROTOCOL_MAXIMUM}
      SECONDBOX_RUNNER_ENABLED_FEATURES: ${SECONDBOX_RUNNER_ENABLED_FEATURES:?set SECONDBOX_RUNNER_ENABLED_FEATURES}
      SECONDBOX_DEFAULT_SUBJECT_MAX_SANDBOXES: ${SECONDBOX_DEFAULT_SUBJECT_MAX_SANDBOXES:?set SECONDBOX_DEFAULT_SUBJECT_MAX_SANDBOXES}
      SECONDBOX_DEFAULT_SUBJECT_MAX_ACTIVE_INSTANCES: ${SECONDBOX_DEFAULT_SUBJECT_MAX_ACTIVE_INSTANCES:?set SECONDBOX_DEFAULT_SUBJECT_MAX_ACTIVE_INSTANCES}
      SECONDBOX_DEFAULT_SUBJECT_MAX_CPU_MILLIS: ${SECONDBOX_DEFAULT_SUBJECT_MAX_CPU_MILLIS:?set SECONDBOX_DEFAULT_SUBJECT_MAX_CPU_MILLIS}
      SECONDBOX_DEFAULT_SUBJECT_MAX_MEMORY_BYTES: ${SECONDBOX_DEFAULT_SUBJECT_MAX_MEMORY_BYTES:?set SECONDBOX_DEFAULT_SUBJECT_MAX_MEMORY_BYTES}
      SECONDBOX_DEFAULT_SUBJECT_MAX_RETAINED_BYTES: ${SECONDBOX_DEFAULT_SUBJECT_MAX_RETAINED_BYTES:?set SECONDBOX_DEFAULT_SUBJECT_MAX_RETAINED_BYTES}
      SECONDBOX_DEFAULT_SUBJECT_MAX_SNAPSHOTS: ${SECONDBOX_DEFAULT_SUBJECT_MAX_SNAPSHOTS:?set SECONDBOX_DEFAULT_SUBJECT_MAX_SNAPSHOTS}
      SECONDBOX_DEFAULT_SUBJECT_MAX_ARTIFACTS: ${SECONDBOX_DEFAULT_SUBJECT_MAX_ARTIFACTS:?set SECONDBOX_DEFAULT_SUBJECT_MAX_ARTIFACTS}
      SECONDBOX_DEFAULT_SUBJECT_MAX_PORT_SESSIONS: ${SECONDBOX_DEFAULT_SUBJECT_MAX_PORT_SESSIONS:?set SECONDBOX_DEFAULT_SUBJECT_MAX_PORT_SESSIONS}
      SECONDBOX_DEFAULT_SUBJECT_MAX_CONCURRENT_OPERATIONS: ${SECONDBOX_DEFAULT_SUBJECT_MAX_CONCURRENT_OPERATIONS:?set SECONDBOX_DEFAULT_SUBJECT_MAX_CONCURRENT_OPERATIONS}
    ports:
      - "${SECONDBOX_API_BIND_IP:?set SECONDBOX_API_BIND_IP}:${SECONDBOX_API_PUBLISHED_PORT:?set SECONDBOX_API_PUBLISHED_PORT}:8080"
      - "${SECONDBOX_RUNNER_BIND_IP:?set SECONDBOX_RUNNER_BIND_IP}:${SECONDBOX_RUNNER_PUBLISHED_PORT:?set SECONDBOX_RUNNER_PUBLISHED_PORT}:9443"
    volumes:
      - control-plane-logs:/var/log/secondbox
      - runner-pki-runtime:/run/secondbox-runner-pki:ro
      - "${SECONDBOX_SIGNED_ASSET_CATALOG_HOST_PATH:?set SECONDBOX_SIGNED_ASSET_CATALOG_HOST_PATH}:${SECONDBOX_SIGNED_ASSET_CATALOG_PATH:?set SECONDBOX_SIGNED_ASSET_CATALOG_PATH}:ro"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    networks:
      - secondbox-backend

  runner-pki-init:
    image: ${SECONDBOX_CONTROL_PLANE_IMAGE:?set SECONDBOX_CONTROL_PLANE_IMAGE}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -m 600 -o 65532 -g 65532 /source/server.key /target/server.key
        install -m 644 -o 65532 -g 65532 /source/runner-ca.crt /target/runner-ca.crt
        install -m 644 -o 65532 -g 65532 /source/server.crt /target/server.crt
    volumes:
      - "${SECONDBOX_RUNNER_PKI_HOST_DIR:?set SECONDBOX_RUNNER_PKI_HOST_DIR}:/source:ro"
      - runner-pki-runtime:/target
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    networks:
      - secondbox-backend

  same-host-runner:
    image: ${SECONDBOX_RUNNER_IMAGE:?set SECONDBOX_RUNNER_IMAGE}
    profiles: ["same-host-runner"]
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    privileged: true
    network_mode: host
    cgroup: host
    labels:
      org.secondbox.runner.qualification: "not-established-by-compose"
    environment:
      SECONDBOX_RUNNER_ID: ${SECONDBOX_RUNNER_ID:?set SECONDBOX_RUNNER_ID}
      SECONDBOX_RUNNER_POOL_ID: ${SECONDBOX_RUNNER_POOL_ID:?set SECONDBOX_RUNNER_POOL_ID}
      SECONDBOX_RUNNER_SOFTWARE_VERSION: ${SECONDBOX_RUNNER_SOFTWARE_VERSION:?set SECONDBOX_RUNNER_SOFTWARE_VERSION}
      SECONDBOX_RUNNER_CONTROL_PLANE_ADDRESS: ${SECONDBOX_RUNNER_CONTROL_PLANE_ADDRESS:?set SECONDBOX_RUNNER_CONTROL_PLANE_ADDRESS}
      SECONDBOX_RUNNER_CONTROL_PLANE_SERVER_NAME: ${SECONDBOX_RUNNER_CONTROL_PLANE_SERVER_NAME:?set SECONDBOX_RUNNER_CONTROL_PLANE_SERVER_NAME}
      SECONDBOX_RUNNER_CREDENTIAL: ${SECONDBOX_RUNNER_CREDENTIAL:?set SECONDBOX_RUNNER_CREDENTIAL}
      SECONDBOX_RUNNER_CLIENT_CERTIFICATE: /run/secondbox-runner-identity/runner.crt
      SECONDBOX_RUNNER_CLIENT_KEY: /run/secondbox-runner-identity/runner.key
      SECONDBOX_RUNNER_CONTROL_PLANE_CA: /run/secondbox-runner-identity/runner-ca.crt
      SECONDBOX_RUNNER_STATE_DIR: ${SECONDBOX_RUNNER_STATE_DIR:?set SECONDBOX_RUNNER_STATE_DIR}
      SECONDBOX_RUNNER_LOG_PATH: ${SECONDBOX_RUNNER_LOG_PATH:?set SECONDBOX_RUNNER_LOG_PATH}
      SECONDBOX_RUNNER_LOG_DIR: ${SECONDBOX_RUNNER_LOG_DIR:?set SECONDBOX_RUNNER_LOG_DIR}
      SECONDBOX_RUNNER_FIRECRACKER_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_JAILER_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_JAILER_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_JAIL_ROOT: ${SECONDBOX_RUNNER_FIRECRACKER_JAIL_ROOT:?set SECONDBOX_RUNNER_FIRECRACKER_JAIL_ROOT}
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID: ${SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID:?set SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID}
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_GID: ${SECONDBOX_RUNNER_FIRECRACKER_JAILER_GID:?set SECONDBOX_RUNNER_FIRECRACKER_JAILER_GID}
      SECONDBOX_RUNNER_FIRECRACKER_CGROUP_VERSION: ${SECONDBOX_RUNNER_FIRECRACKER_CGROUP_VERSION:?set SECONDBOX_RUNNER_FIRECRACKER_CGROUP_VERSION}
      SECONDBOX_RUNNER_FIRECRACKER_CGROUP_PARENT: ${SECONDBOX_RUNNER_FIRECRACKER_CGROUP_PARENT:?set SECONDBOX_RUNNER_FIRECRACKER_CGROUP_PARENT}
      SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH: ${SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH:?set SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH}
      SECONDBOX_RUNNER_FIRECRACKER_KERNEL_ARGS: ${SECONDBOX_RUNNER_FIRECRACKER_KERNEL_ARGS:?set SECONDBOX_RUNNER_FIRECRACKER_KERNEL_ARGS}
      SECONDBOX_RUNNER_FIRECRACKER_CPU_TEMPLATE: ${SECONDBOX_RUNNER_FIRECRACKER_CPU_TEMPLATE:?set SECONDBOX_RUNNER_FIRECRACKER_CPU_TEMPLATE}
      SECONDBOX_RUNNER_FIRECRACKER_RUN_DIR: ${SECONDBOX_RUNNER_FIRECRACKER_RUN_DIR:?set SECONDBOX_RUNNER_FIRECRACKER_RUN_DIR}
      SECONDBOX_RUNNER_FIRECRACKER_LOG_DIR: ${SECONDBOX_RUNNER_FIRECRACKER_LOG_DIR:?set SECONDBOX_RUNNER_FIRECRACKER_LOG_DIR}
      SECONDBOX_RUNNER_FIRECRACKER_ALLOW_UNJAILED: ${SECONDBOX_RUNNER_FIRECRACKER_ALLOW_UNJAILED:?set SECONDBOX_RUNNER_FIRECRACKER_ALLOW_UNJAILED}
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY: ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY:?set SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY}
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256: ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256:?set SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256}
      SECONDBOX_RUNNER_SANDBOX_WORKSPACE_DIR: ${SECONDBOX_RUNNER_SANDBOX_WORKSPACE_DIR:?set SECONDBOX_RUNNER_SANDBOX_WORKSPACE_DIR}
      SECONDBOX_RUNNER_CHECKPOINT_RESTORE_SPOOL_DIR: ${SECONDBOX_RUNNER_CHECKPOINT_RESTORE_SPOOL_DIR:?set SECONDBOX_RUNNER_CHECKPOINT_RESTORE_SPOOL_DIR}
      SECONDBOX_RUNNER_SANDBOX_STORAGE_BACKEND: ${SECONDBOX_RUNNER_SANDBOX_STORAGE_BACKEND:?set SECONDBOX_RUNNER_SANDBOX_STORAGE_BACKEND}
      SECONDBOX_RUNNER_SANDBOX_THIN_POOL_DEVICE: ${SECONDBOX_RUNNER_SANDBOX_THIN_POOL_DEVICE:?set SECONDBOX_RUNNER_SANDBOX_THIN_POOL_DEVICE}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_RECOVERY_PERCENT: ${SECONDBOX_RUNNER_STORAGE_PRESSURE_RECOVERY_PERCENT:?set SECONDBOX_RUNNER_STORAGE_PRESSURE_RECOVERY_PERCENT}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_WARNING_PERCENT: ${SECONDBOX_RUNNER_STORAGE_PRESSURE_WARNING_PERCENT:?set SECONDBOX_RUNNER_STORAGE_PRESSURE_WARNING_PERCENT}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_ADMISSION_DENY_PERCENT: ${SECONDBOX_RUNNER_STORAGE_PRESSURE_ADMISSION_DENY_PERCENT:?set SECONDBOX_RUNNER_STORAGE_PRESSURE_ADMISSION_DENY_PERCENT}
      SECONDBOX_RUNNER_SANDBOX_MAX_VCPUS: ${SECONDBOX_RUNNER_SANDBOX_MAX_VCPUS:?set SECONDBOX_RUNNER_SANDBOX_MAX_VCPUS}
      SECONDBOX_RUNNER_SANDBOX_MAX_MEMORY_MIB: ${SECONDBOX_RUNNER_SANDBOX_MAX_MEMORY_MIB:?set SECONDBOX_RUNNER_SANDBOX_MAX_MEMORY_MIB}
      SECONDBOX_RUNNER_SANDBOX_MAX_DISK_MIB: ${SECONDBOX_RUNNER_SANDBOX_MAX_DISK_MIB:?set SECONDBOX_RUNNER_SANDBOX_MAX_DISK_MIB}
      SECONDBOX_RUNNER_SANDBOX_MEMORY_BUDGET_MIB: ${SECONDBOX_RUNNER_SANDBOX_MEMORY_BUDGET_MIB:?set SECONDBOX_RUNNER_SANDBOX_MEMORY_BUDGET_MIB}
      SECONDBOX_RUNNER_SANDBOX_GUEST_IP: ${SECONDBOX_RUNNER_SANDBOX_GUEST_IP:?set SECONDBOX_RUNNER_SANDBOX_GUEST_IP}
      SECONDBOX_RUNNER_SANDBOX_BRIDGE_NAME: ${SECONDBOX_RUNNER_SANDBOX_BRIDGE_NAME:?set SECONDBOX_RUNNER_SANDBOX_BRIDGE_NAME}
      SECONDBOX_RUNNER_SANDBOX_BRIDGE_CIDR: ${SECONDBOX_RUNNER_SANDBOX_BRIDGE_CIDR:?set SECONDBOX_RUNNER_SANDBOX_BRIDGE_CIDR}
      SECONDBOX_RUNNER_SANDBOX_GUEST_CIDR: ${SECONDBOX_RUNNER_SANDBOX_GUEST_CIDR:?set SECONDBOX_RUNNER_SANDBOX_GUEST_CIDR}
      SECONDBOX_RUNNER_SANDBOX_TAP_PREFIX: ${SECONDBOX_RUNNER_SANDBOX_TAP_PREFIX:?set SECONDBOX_RUNNER_SANDBOX_TAP_PREFIX}
      SECONDBOX_RUNNER_SANDBOX_NETWORK_STATE_DIR: ${SECONDBOX_RUNNER_SANDBOX_NETWORK_STATE_DIR:?set SECONDBOX_RUNNER_SANDBOX_NETWORK_STATE_DIR}
      SECONDBOX_RUNNER_SANDBOX_DELETE_BRIDGE: ${SECONDBOX_RUNNER_SANDBOX_DELETE_BRIDGE:?set SECONDBOX_RUNNER_SANDBOX_DELETE_BRIDGE}
      SECONDBOX_RUNNER_NETWORK_POLICY_NFT_PATH: ${SECONDBOX_RUNNER_NETWORK_POLICY_NFT_PATH:?set SECONDBOX_RUNNER_NETWORK_POLICY_NFT_PATH}
      SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_PINS: ${SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_PINS:?set SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_PINS}
      SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_TTL: ${SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_TTL:?set SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_TTL}
      SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_ADDRESSES: ${SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_ADDRESSES:?set SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_ADDRESSES}
      SECONDBOX_RUNNER_NETWORK_POLICY_MANAGEMENT_CIDRS: ${SECONDBOX_RUNNER_NETWORK_POLICY_MANAGEMENT_CIDRS:?set SECONDBOX_RUNNER_NETWORK_POLICY_MANAGEMENT_CIDRS}
      SECONDBOX_RUNNER_NETWORK_POLICY_DNS_UPSTREAM: ${SECONDBOX_RUNNER_NETWORK_POLICY_DNS_UPSTREAM:?set SECONDBOX_RUNNER_NETWORK_POLICY_DNS_UPSTREAM}
      SECONDBOX_RUNNER_MAX_CONCURRENT_PER_SANDBOX: ${SECONDBOX_RUNNER_MAX_CONCURRENT_PER_SANDBOX:?set SECONDBOX_RUNNER_MAX_CONCURRENT_PER_SANDBOX}
      SECONDBOX_RUNNER_MAX_CONCURRENT_GLOBAL: ${SECONDBOX_RUNNER_MAX_CONCURRENT_GLOBAL:?set SECONDBOX_RUNNER_MAX_CONCURRENT_GLOBAL}
      SECONDBOX_RUNNER_FILE_TRANSFER_MAX_BYTES: ${SECONDBOX_RUNNER_FILE_TRANSFER_MAX_BYTES:?set SECONDBOX_RUNNER_FILE_TRANSFER_MAX_BYTES}
      SECONDBOX_RUNNER_GUEST_CONTROL_VSOCK_PORT: ${SECONDBOX_RUNNER_GUEST_CONTROL_VSOCK_PORT:?set SECONDBOX_RUNNER_GUEST_CONTROL_VSOCK_PORT}
      SECONDBOX_RUNNER_GUEST_PROTOCOL_VSOCK_PORT: ${SECONDBOX_RUNNER_GUEST_PROTOCOL_VSOCK_PORT:?set SECONDBOX_RUNNER_GUEST_PROTOCOL_VSOCK_PORT}
      SECONDBOX_RUNNER_GUEST_HEARTBEAT_INTERVAL: ${SECONDBOX_RUNNER_GUEST_HEARTBEAT_INTERVAL:?set SECONDBOX_RUNNER_GUEST_HEARTBEAT_INTERVAL}
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    volumes:
      - "${SECONDBOX_RUNNER_IDENTITY_HOST_DIR:?set SECONDBOX_RUNNER_IDENTITY_HOST_DIR}:/run/secondbox-runner-identity:ro"
      - "${SECONDBOX_RUNNER_ARTIFACT_HOST_DIR:?set SECONDBOX_RUNNER_ARTIFACT_HOST_DIR}:/opt/secondbox-artifacts:ro"
      - "${SECONDBOX_RUNNER_STATE_HOST_DIR:?set SECONDBOX_RUNNER_STATE_HOST_DIR}:/var/lib/secondbox-runner:rshared"
      - "${SECONDBOX_RUNNER_WORKSPACE_HOST_DIR:?set SECONDBOX_RUNNER_WORKSPACE_HOST_DIR}:${SECONDBOX_RUNNER_SANDBOX_WORKSPACE_DIR:?set SECONDBOX_RUNNER_SANDBOX_WORKSPACE_DIR}:rshared"
      - "${SECONDBOX_RUNNER_CHECKPOINT_RESTORE_SPOOL_HOST_DIR:?set SECONDBOX_RUNNER_CHECKPOINT_RESTORE_SPOOL_HOST_DIR}:${SECONDBOX_RUNNER_CHECKPOINT_RESTORE_SPOOL_DIR:?set SECONDBOX_RUNNER_CHECKPOINT_RESTORE_SPOOL_DIR}:rshared"
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test: ["CMD", "/usr/local/bin/secondbox-runner", "-healthcheck", "-healthcheck-timeout", "5s"]
      interval: 10s
      timeout: 6s
      retries: 4
      start_period: 15s

  postgres:
    image: ${SECONDBOX_POSTGRES_IMAGE:?set SECONDBOX_POSTGRES_IMAGE}
    profiles: ["development"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SECONDBOX_POSTGRES_DATABASE:?set SECONDBOX_POSTGRES_DATABASE}
      POSTGRES_USER: ${SECONDBOX_POSTGRES_USER:?set SECONDBOX_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SECONDBOX_POSTGRES_PASSWORD:?set SECONDBOX_POSTGRES_PASSWORD}
    ports:
      - "${SECONDBOX_POSTGRES_BIND_IP:?set SECONDBOX_POSTGRES_BIND_IP}:${SECONDBOX_POSTGRES_PUBLISHED_PORT:?set SECONDBOX_POSTGRES_PUBLISHED_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../migrations/postgres/0001_secondbox.sql:/docker-entrypoint-initdb.d/0001_secondbox.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - secondbox-backend

  object-store:
    image: ${SECONDBOX_OBJECT_STORE_IMAGE:?set SECONDBOX_OBJECT_STORE_IMAGE}
    profiles: ["development"]
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${SECONDBOX_OBJECT_STORE_ROOT_USER:?set SECONDBOX_OBJECT_STORE_ROOT_USER}
      RUSTFS_SECRET_KEY: ${SECONDBOX_OBJECT_STORE_ROOT_PASSWORD:?set SECONDBOX_OBJECT_STORE_ROOT_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"
    ports:
      - "${SECONDBOX_OBJECT_STORE_BIND_IP:?set SECONDBOX_OBJECT_STORE_BIND_IP}:${SECONDBOX_OBJECT_STORE_PUBLISHED_PORT:?set SECONDBOX_OBJECT_STORE_PUBLISHED_PORT}:9000"
      - "${SECONDBOX_OBJECT_STORE_BIND_IP:?set SECONDBOX_OBJECT_STORE_BIND_IP}:${SECONDBOX_OBJECT_STORE_CONSOLE_PUBLISHED_PORT:?set SECONDBOX_OBJECT_STORE_CONSOLE_PUBLISHED_PORT}:9001"
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - secondbox-backend

  object-store-init:
    image: ${SECONDBOX_OBJECT_STORE_CLIENT_IMAGE:?set SECONDBOX_OBJECT_STORE_CLIENT_IMAGE}
    profiles: ["development"]
    depends_on:
      object-store:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/usr/bin/mc"]
    command:
      - mb
      - --ignore-existing
      - secondbox/${SECONDBOX_OBJECT_STORE_BUCKET:?set SECONDBOX_OBJECT_STORE_BUCKET}
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MC_HOST_secondbox: http://${SECONDBOX_OBJECT_STORE_ROOT_USER:?set SECONDBOX_OBJECT_STORE_ROOT_USER}:${SECONDBOX_OBJECT_STORE_ROOT_PASSWORD:?set SECONDBOX_OBJECT_STORE_ROOT_PASSWORD}@object-store:9000
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - secondbox-backend

networks:
  secondbox-backend:
    driver: bridge

volumes:
  control-plane-logs:
  object-store-data:
  postgres-data:
  runner-pki-runtime:
