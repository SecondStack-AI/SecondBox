name: secondbox

services:
  control-plane:
    image: ${SECONDBOX_CONTROL_PLANE_IMAGE:?set SECONDBOX_CONTROL_PLANE_IMAGE}
    restart: unless-stopped
    depends_on:
      runner-pki-init:
        condition: service_completed_successfully
      asset-catalog-init:
        condition: service_completed_successfully
    environment:
      SECONDBOX_LISTEN_ADDR: ${SECONDBOX_LISTEN_ADDR:?set SECONDBOX_LISTEN_ADDR}
      SECONDBOX_PUBLIC_BASE_URL: ${SECONDBOX_PUBLIC_BASE_URL:?set SECONDBOX_PUBLIC_BASE_URL}
      SECONDBOX_RUNNER_LISTEN_ADDR: ${SECONDBOX_RUNNER_LISTEN_ADDR:?set SECONDBOX_RUNNER_LISTEN_ADDR}
      SECONDBOX_DATABASE_URL: ${SECONDBOX_DATABASE_URL:?set SECONDBOX_DATABASE_URL}
      SECONDBOX_LOG_PATH: ${SECONDBOX_LOG_PATH:?set SECONDBOX_LOG_PATH}
      SECONDBOX_PLATFORM_TOKEN: ${SECONDBOX_PLATFORM_TOKEN:?set SECONDBOX_PLATFORM_TOKEN}
      SECONDBOX_APPLICATION_AUTHORITIES_JSON: ${SECONDBOX_APPLICATION_AUTHORITIES_JSON:?set SECONDBOX_APPLICATION_AUTHORITIES_JSON}
      SECONDBOX_RUNNER_SERVER_CERTIFICATE: ${SECONDBOX_RUNNER_SERVER_CERTIFICATE:?set SECONDBOX_RUNNER_SERVER_CERTIFICATE}
      SECONDBOX_RUNNER_SERVER_PRIVATE_KEY: ${SECONDBOX_RUNNER_SERVER_PRIVATE_KEY:?set SECONDBOX_RUNNER_SERVER_PRIVATE_KEY}
      SECONDBOX_RUNNER_CA_CERTIFICATE: ${SECONDBOX_RUNNER_CA_CERTIFICATE:?set SECONDBOX_RUNNER_CA_CERTIFICATE}
      SECONDBOX_RUNNER_CREDENTIAL: ${SECONDBOX_RUNNER_CREDENTIAL:?set SECONDBOX_RUNNER_CREDENTIAL}
      SECONDBOX_RUNNER_COMMAND_POLL_INTERVAL_MILLISECONDS: ${SECONDBOX_RUNNER_COMMAND_POLL_INTERVAL_MILLISECONDS:?set SECONDBOX_RUNNER_COMMAND_POLL_INTERVAL_MILLISECONDS}
      SECONDBOX_DATA_PLANE_POLL_INTERVAL_MILLISECONDS: ${SECONDBOX_DATA_PLANE_POLL_INTERVAL_MILLISECONDS:?set SECONDBOX_DATA_PLANE_POLL_INTERVAL_MILLISECONDS}
      SECONDBOX_DATA_PLANE_RETENTION_SECONDS: ${SECONDBOX_DATA_PLANE_RETENTION_SECONDS:?set SECONDBOX_DATA_PLANE_RETENTION_SECONDS}
      SECONDBOX_SIGNED_ASSET_CATALOG_PATH: ${SECONDBOX_SIGNED_ASSET_CATALOG_PATH:?set SECONDBOX_SIGNED_ASSET_CATALOG_PATH}
      SECONDBOX_RUNNER_ENABLED_FEATURES: ${SECONDBOX_RUNNER_ENABLED_FEATURES:?set SECONDBOX_RUNNER_ENABLED_FEATURES}
      SECONDBOX_DEFAULT_SUBJECT_MAX_SANDBOXES: ${SECONDBOX_DEFAULT_SUBJECT_MAX_SANDBOXES:?set SECONDBOX_DEFAULT_SUBJECT_MAX_SANDBOXES}
      SECONDBOX_DEFAULT_SUBJECT_MAX_ACTIVE_INSTANCES: ${SECONDBOX_DEFAULT_SUBJECT_MAX_ACTIVE_INSTANCES:?set SECONDBOX_DEFAULT_SUBJECT_MAX_ACTIVE_INSTANCES}
      SECONDBOX_DEFAULT_SUBJECT_MAX_CPU_MILLIS: ${SECONDBOX_DEFAULT_SUBJECT_MAX_CPU_MILLIS:?set SECONDBOX_DEFAULT_SUBJECT_MAX_CPU_MILLIS}
      SECONDBOX_DEFAULT_SUBJECT_MAX_MEMORY_BYTES: ${SECONDBOX_DEFAULT_SUBJECT_MAX_MEMORY_BYTES:?set SECONDBOX_DEFAULT_SUBJECT_MAX_MEMORY_BYTES}
      SECONDBOX_DEFAULT_SUBJECT_MAX_SNAPSHOTS: ${SECONDBOX_DEFAULT_SUBJECT_MAX_SNAPSHOTS:?set SECONDBOX_DEFAULT_SUBJECT_MAX_SNAPSHOTS}
      SECONDBOX_DEFAULT_SUBJECT_MAX_PORT_SESSIONS: ${SECONDBOX_DEFAULT_SUBJECT_MAX_PORT_SESSIONS:?set SECONDBOX_DEFAULT_SUBJECT_MAX_PORT_SESSIONS}
      SECONDBOX_DEFAULT_SUBJECT_MAX_CONCURRENT_OPERATIONS: ${SECONDBOX_DEFAULT_SUBJECT_MAX_CONCURRENT_OPERATIONS:?set SECONDBOX_DEFAULT_SUBJECT_MAX_CONCURRENT_OPERATIONS}
      # Value-less mappings preserve true absence while forwarding selected
      # values from the generated env file.
      SECONDBOX_HTTP_TIMEOUT_SECONDS:
      SECONDBOX_RUNNER_HEARTBEAT_INTERVAL_MILLISECONDS:
      SECONDBOX_RUNNER_HEARTBEAT_TIMEOUT_MILLISECONDS:
      SECONDBOX_RUNNER_COMMAND_DELIVERY_BATCH_SIZE:
      SECONDBOX_RUNNER_EVENT_PERSISTENCE_BATCH_SIZE:
      SECONDBOX_RUNNER_EVENT_PERSISTENCE_BATCH_WAIT_MILLISECONDS:
      SECONDBOX_DATA_PLANE_MAXIMUM_SESSION_BYTES:
      SECONDBOX_LIFECYCLE_RECONCILE_BATCH_SIZE:
      SECONDBOX_LIFECYCLE_RECONCILE_POLL_INTERVAL_MILLISECONDS:
      SECONDBOX_LIFECYCLE_RECONCILE_CLAIM_DURATION_MILLISECONDS:
      SECONDBOX_ASSIGNMENT_CLAIM_DURATION_MILLISECONDS:
      SECONDBOX_ASSIGNMENT_DEADLINE_MILLISECONDS:
      SECONDBOX_ASSIGNMENT_RETRY_LIMIT:
      SECONDBOX_SCHEDULER_SERIALIZATION_RETRY_LIMIT:
    ports:
      - "${SECONDBOX_API_BIND_IP:?set SECONDBOX_API_BIND_IP}:${SECONDBOX_API_PUBLISHED_PORT:?set SECONDBOX_API_PUBLISHED_PORT}:8080"
      - "${SECONDBOX_RUNNER_BIND_IP:?set SECONDBOX_RUNNER_BIND_IP}:${SECONDBOX_RUNNER_PUBLISHED_PORT:?set SECONDBOX_RUNNER_PUBLISHED_PORT}:9443"
    volumes:
      - control-plane-logs:/var/log/secondbox
      - runner-pki-runtime:/run/secondbox-runner-pki:ro
      - control-plane-assets:/etc/secondbox:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    networks: [secondbox-backend]

  runner-pki-init:
    image: ${SECONDBOX_CONTROL_PLANE_IMAGE:?set SECONDBOX_CONTROL_PLANE_IMAGE}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -m 600 -o 65532 -g 65532 /source/server.key /target/server.key
        install -m 644 -o 65532 -g 65532 /source/runner-ca.crt /target/runner-ca.crt
        install -m 644 -o 65532 -g 65532 /source/server.crt /target/server.crt
    volumes:
      - "${SECONDBOX_RUNNER_PKI_HOST_DIR:?set SECONDBOX_RUNNER_PKI_HOST_DIR}:/source:ro"
      - runner-pki-runtime:/target
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    networks: [secondbox-backend]

  asset-catalog-init:
    image: ${SECONDBOX_CONTROL_PLANE_IMAGE:?set SECONDBOX_CONTROL_PLANE_IMAGE}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -m 644 -o 65532 -g 65532 /source/signed-assets.json /target/signed-assets.json
    volumes:
      - "${SECONDBOX_SIGNED_ASSET_CATALOG_HOST_PATH:?set SECONDBOX_SIGNED_ASSET_CATALOG_HOST_PATH}:/source/signed-assets.json:ro"
      - control-plane-assets:/target
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    networks: [secondbox-backend]

networks:
  secondbox-backend:
    driver: bridge

volumes:
  control-plane-assets:
  control-plane-logs:
  runner-pki-runtime:
