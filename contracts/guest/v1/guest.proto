syntax = "proto3";

package secondbox.guest.v1;

option go_package = "github.com/SecondStack-AI/SecondBox/gen/guest/v1;guestv1";

// GuestAgent is carried over the authenticated host-to-guest transport. The
// runner sends Hello first and MUST wait for Welcome before any other frame.
service GuestAgent {
  rpc Connect(stream RunnerToGuest) returns (stream GuestToRunner);
}

message ProtocolGenerationRange {
  uint32 minimum = 1;
  uint32 maximum = 2;
}

enum GuestFeature {
  reserved 5;
  GUEST_FEATURE_UNSPECIFIED = 0;
  GUEST_FEATURE_STREAMING_EXEC = 1;
  GUEST_FEATURE_PTY_RESIZE = 2;
  GUEST_FEATURE_DESCRIPTOR_PINNED_FILESYSTEM = 3;
  GUEST_FEATURE_ACTIVITY_EVENTS = 4;
  GUEST_FEATURE_PORT_PROXY = 6;
}

// ConnectionBinding is immutable after negotiation. Every admitted operation
// carries the same Instance, Sandbox generation, and connection nonce.
message ConnectionBinding {
  string instance_id = 1;
  string sandbox_id = 2;
  uint64 sandbox_generation = 3;
  bytes connection_nonce = 4;
}

message Hello {
  ConnectionBinding binding = 1;
  ProtocolGenerationRange supported_generations = 2;
  repeated GuestFeature requested_features = 3;
  repeated GuestFeature mandatory_features = 4;
  string expected_image_manifest_digest = 5;
  string expected_toolchain_manifest_digest = 6;
}

message Welcome {
  ConnectionBinding binding = 1;
  uint32 selected_generation = 2;
  repeated GuestFeature enabled_features = 3;
  string guest_build_id = 4;
  string image_manifest_digest = 5;
  string toolchain_manifest_digest = 6;
  uint64 heartbeat_interval_ms = 7;
}

enum HandshakeRejectionKind {
  HANDSHAKE_REJECTION_KIND_UNSPECIFIED = 0;
  HANDSHAKE_REJECTION_KIND_VERSION_UNSUPPORTED = 1;
  HANDSHAKE_REJECTION_KIND_FEATURE_UNSUPPORTED = 2;
  HANDSHAKE_REJECTION_KIND_BINDING_MISMATCH = 3;
  HANDSHAKE_REJECTION_KIND_IMAGE_MISMATCH = 4;
  HANDSHAKE_REJECTION_KIND_TOOLCHAIN_MISMATCH = 5;
  HANDSHAKE_REJECTION_KIND_INVALID_HELLO = 6;
}

message HandshakeRejection {
  HandshakeRejectionKind kind = 1;
  string safe_detail = 2;
}

// OperationBinding makes replay and generation validation independent from
// transport lifetime. sequence is per direction and stream, beginning at one.
message OperationBinding {
  ConnectionBinding connection = 1;
  string assignment_id = 2;
  string operation_id = 3;
  string stream_id = 4;
  uint64 sequence = 5;
}

message EnvironmentEntry {
  string name = 1;
  bytes value = 2;
}

message ArgvCommand {
  repeated string argument = 1;
}

message PtyDimensions {
  uint32 rows = 1;
  uint32 columns = 2;
}

message ExecRequest {
  oneof command {
    string shell = 1;
    ArgvCommand argv = 2;
  }
  string cwd = 3;
  repeated EnvironmentEntry environment = 4;
  uint64 deadline_unix_ms = 5;
  uint64 output_limit_bytes = 6;
  PtyDimensions pty = 7;
  bytes stdin = 8;
  bool streaming = 9;
}

enum ExecAdmissionKind {
  EXEC_ADMISSION_KIND_UNSPECIFIED = 0;
  EXEC_ADMISSION_KIND_ACCEPTED = 1;
  EXEC_ADMISSION_KIND_INVALID_REQUEST = 2;
  EXEC_ADMISSION_KIND_GENERATION_MISMATCH = 3;
  EXEC_ADMISSION_KIND_FEATURE_UNSUPPORTED = 4;
  EXEC_ADMISSION_KIND_FROZEN = 5;
  EXEC_ADMISSION_KIND_CAPACITY_EXHAUSTED = 6;
}

message ExecAdmission {
  ExecAdmissionKind kind = 1;
  string process_id = 2;
  string safe_detail = 3;
  SpawnFailureReason spawn_failure_reason = 4;
  string message = 5;
}

message ExecInput {
  bytes data = 1;
  bool end_of_input = 2;
}

enum ExecOutputChannel {
  EXEC_OUTPUT_CHANNEL_UNSPECIFIED = 0;
  EXEC_OUTPUT_CHANNEL_STDOUT = 1;
  EXEC_OUTPUT_CHANNEL_STDERR = 2;
}

message ExecOutput {
  ExecOutputChannel channel = 1;
  bytes data = 2;
}

message ByteCredit {
  uint64 byte_count = 1;
}

message ExecCancel {
  string reason = 1;
}

enum ExecTerminalKind {
  EXEC_TERMINAL_KIND_UNSPECIFIED = 0;
  EXEC_TERMINAL_KIND_EXITED = 1;
  EXEC_TERMINAL_KIND_SPAWN_FAILED = 2;
  EXEC_TERMINAL_KIND_DEADLINE_EXCEEDED = 3;
  EXEC_TERMINAL_KIND_CANCELLED = 4;
  EXEC_TERMINAL_KIND_OUTPUT_EXHAUSTED = 5;
}

enum SpawnFailureReason {
  SPAWN_FAILURE_REASON_UNSPECIFIED = 0;
  SPAWN_FAILURE_REASON_NOT_FOUND = 1;
  SPAWN_FAILURE_REASON_PERMISSION_DENIED = 2;
  SPAWN_FAILURE_REASON_INVALID_CWD = 3;
  SPAWN_FAILURE_REASON_MALFORMED_EXECUTABLE = 4;
}

message ExecTerminal {
  ExecTerminalKind kind = 1;
  int32 exit_code = 2;
  string safe_detail = 3;
  int32 signal = 4;
  SpawnFailureReason spawn_failure_reason = 5;
  uint64 elapsed_milliseconds = 6;
  uint64 limit_bytes = 7;
  string message = 8;
}

message ExecFrame {
  OperationBinding binding = 1;
  oneof payload {
    ExecRequest request = 10;
    ExecAdmission admission = 11;
    ExecInput input = 12;
    ExecOutput output = 13;
    ByteCredit credit = 14;
    ExecCancel cancel = 15;
    ExecTerminal terminal = 16;
  }
}

enum FileOperation {
  FILE_OPERATION_UNSPECIFIED = 0;
  FILE_OPERATION_READ = 1;
  FILE_OPERATION_WRITE = 2;
  FILE_OPERATION_STAT = 3;
  FILE_OPERATION_LIST_DIRECT_CHILDREN = 4;
  FILE_OPERATION_EXISTS = 5;
  FILE_OPERATION_MKDIR = 6;
  FILE_OPERATION_REMOVE = 7;
}

message FileRequest {
  FileOperation operation = 1;
  string workspace_relative_path = 2;
  uint64 expected_size = 3;
  string expected_checksum = 4;
  uint32 create_mode = 5;
  bool recursive = 6;
  bool force = 7;
}

message FileChunk {
  uint64 offset = 1;
  bytes data = 2;
}

message FileMetadata {
  bool exists = 1;
  uint64 size = 2;
  uint32 mode = 3;
  string checksum = 4;
  repeated string direct_children = 5;
  FileKind kind = 6;
  uint64 modified_at_unix_ms = 7;
  repeated FileMetadataEntry direct_child_entries = 8;
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_FILE = 1;
  FILE_KIND_DIRECTORY = 2;
  FILE_KIND_SYMBOLIC_LINK = 3;
}

message FileMetadataEntry {
  string path = 1;
  FileKind kind = 2;
  uint64 size = 3;
  uint64 modified_at_unix_ms = 4;
}

enum FileTerminalKind {
  FILE_TERMINAL_KIND_UNSPECIFIED = 0;
  FILE_TERMINAL_KIND_COMPLETED = 1;
  FILE_TERMINAL_KIND_NOT_FOUND = 2;
  FILE_TERMINAL_KIND_INVALID_PATH = 3;
  FILE_TERMINAL_KIND_SYMLINK_REJECTED = 4;
  FILE_TERMINAL_KIND_PERMISSION_DENIED = 5;
  FILE_TERMINAL_KIND_CHECKSUM_MISMATCH = 6;
  FILE_TERMINAL_KIND_LIMIT_EXCEEDED = 7;
  FILE_TERMINAL_KIND_CANCELLED = 8;
  FILE_TERMINAL_KIND_FROZEN = 9;
}

message FileTerminal {
  FileTerminalKind kind = 1;
  string safe_detail = 2;
}

message FileFrame {
  OperationBinding binding = 1;
  oneof payload {
    FileRequest request = 10;
    FileChunk chunk = 11;
    FileMetadata metadata = 12;
    ByteCredit credit = 13;
    ExecCancel cancel = 14;
    FileTerminal terminal = 15;
  }
}

message PtyInput {
  bytes data = 1;
}

message PtyResize {
  uint32 rows = 1;
  uint32 columns = 2;
}

message PtyDetach {
  string reconnect_id = 1;
}

message PtyAttach {
  string reconnect_id = 1;
}

message PtyFrame {
  OperationBinding binding = 1;
  oneof payload {
    PtyInput input = 10;
    ExecOutput output = 11;
    PtyResize resize = 12;
    PtyDetach detach = 13;
    PtyAttach attach = 14;
    ByteCredit credit = 15;
    ExecCancel cancel = 16;
    ExecTerminal terminal = 17;
  }
}

message PortRequest {
  uint32 guest_port = 1;
  string protocol = 2;
  uint64 idle_timeout_ms = 3;
}

message PortBytes {
  bytes data = 1;
}

enum PortTerminalKind {
  PORT_TERMINAL_KIND_UNSPECIFIED = 0;
  PORT_TERMINAL_KIND_CLOSED = 1;
  PORT_TERMINAL_KIND_CANCELLED = 2;
  PORT_TERMINAL_KIND_POLICY_DENIED = 3;
  PORT_TERMINAL_KIND_LIMIT_EXCEEDED = 4;
}

message PortTerminal {
  PortTerminalKind kind = 1;
  string safe_detail = 2;
}

message PortFrame {
  OperationBinding binding = 1;
  oneof payload {
    PortRequest request = 10;
    PortBytes bytes = 11;
    ByteCredit credit = 12;
    ExecCancel cancel = 13;
    PortTerminal terminal = 14;
  }
}

enum ActivityKind {
  ACTIVITY_KIND_UNSPECIFIED = 0;
  ACTIVITY_KIND_EXEC = 1;
  ACTIVITY_KIND_FILE_TRANSFER = 2;
  ACTIVITY_KIND_PTY = 3;
  ACTIVITY_KIND_PORT = 4;
  ACTIVITY_KIND_EXPLICIT_TOUCH = 5;
}

enum ActivityPhase {
  ACTIVITY_PHASE_UNSPECIFIED = 0;
  ACTIVITY_PHASE_STARTED = 1;
  ACTIVITY_PHASE_PROGRESS = 2;
  ACTIVITY_PHASE_FINISHED = 3;
  ACTIVITY_PHASE_ACKNOWLEDGED = 4;
}

message UsefulActivity {
  ConnectionBinding binding = 1;
  string operation_id = 2;
  uint64 sequence = 3;
  ActivityKind kind = 4;
  ActivityPhase phase = 5;
  uint64 observed_at_unix_ms = 6;
}

message Heartbeat {
  ConnectionBinding binding = 1;
  uint64 sequence = 2;
  uint64 observed_at_unix_ms = 3;
  uint32 active_exec = 4;
  uint32 active_files = 5;
  uint32 active_ptys = 6;
  uint32 active_ports = 7;
}

message FreezeRequest {
  OperationBinding binding = 1;
  uint64 drain_deadline_unix_ms = 2;
}

enum FreezeTerminalKind {
  FREEZE_TERMINAL_KIND_UNSPECIFIED = 0;
  FREEZE_TERMINAL_KIND_FROZEN = 1;
  FREEZE_TERMINAL_KIND_BUSY = 2;
  FREEZE_TERMINAL_KIND_DEADLINE_EXCEEDED = 3;
  FREEZE_TERMINAL_KIND_FAILED = 4;
}

message FreezeResult {
  OperationBinding binding = 1;
  FreezeTerminalKind kind = 2;
  bytes freeze_token = 3;
  string workspace_digest = 4;
  string safe_detail = 5;
}

message ThawRequest {
  OperationBinding binding = 1;
  bytes freeze_token = 2;
}

message ThawResult {
  OperationBinding binding = 1;
  bool thawed = 2;
  string safe_detail = 3;
}

message RunnerToGuest {
  oneof message {
    Hello hello = 1;
    ExecFrame exec = 2;
    FileFrame file = 3;
    PtyFrame pty = 4;
    PortFrame port = 5;
    FreezeRequest freeze = 6;
    ThawRequest thaw = 7;
  }
}

message GuestToRunner {
  oneof message {
    Welcome welcome = 1;
    HandshakeRejection rejection = 2;
    Heartbeat heartbeat = 3;
    UsefulActivity useful_activity = 4;
    ExecFrame exec = 5;
    FileFrame file = 6;
    PtyFrame pty = 7;
    PortFrame port = 8;
    FreezeResult freeze = 9;
    ThawResult thaw = 10;
  }
}
