services:
  postgres:
    image: ${SECONDBOX_STRESS_POSTGRES_IMAGE:?SECONDBOX_STRESS_POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: secondbox_stress
      POSTGRES_PASSWORD: ${SECONDBOX_STRESS_POSTGRES_PASSWORD:?SECONDBOX_STRESS_POSTGRES_PASSWORD is required}
      POSTGRES_USER: secondbox
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 "$$PGDATA/postmaster.pid")" = "1" &&
          pg_isready -U secondbox -d secondbox_stress
      interval: 1s
      timeout: 5s
      retries: 60
    networks:
      - scenario

  object-store:
    image: ${SECONDBOX_STRESS_OBJECT_STORE_IMAGE:?SECONDBOX_STRESS_OBJECT_STORE_IMAGE is required}
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${SECONDBOX_STRESS_OBJECT_STORE_USER:?SECONDBOX_STRESS_OBJECT_STORE_USER is required}
      RUSTFS_SECRET_KEY: ${SECONDBOX_STRESS_OBJECT_STORE_PASSWORD:?SECONDBOX_STRESS_OBJECT_STORE_PASSWORD is required}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:9000/health/ready"]
      interval: 1s
      timeout: 5s
      retries: 60
    networks:
      - scenario

  object-store-init:
    image: ${SECONDBOX_STRESS_OBJECT_STORE_CLIENT_IMAGE:?SECONDBOX_STRESS_OBJECT_STORE_CLIENT_IMAGE is required}
    depends_on:
      object-store:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "secondbox/secondbox-stress"]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MC_HOST_secondbox: http://${SECONDBOX_STRESS_OBJECT_STORE_USER:?SECONDBOX_STRESS_OBJECT_STORE_USER is required}:${SECONDBOX_STRESS_OBJECT_STORE_PASSWORD:?SECONDBOX_STRESS_OBJECT_STORE_PASSWORD is required}@object-store:9000
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - scenario

  control-plane:
    image: ${SECONDBOX_STRESS_CONTROL_PLANE_BASE_IMAGE:?SECONDBOX_STRESS_CONTROL_PLANE_BASE_IMAGE is required}
    user: "${SECONDBOX_STRESS_UID:?SECONDBOX_STRESS_UID is required}:${SECONDBOX_STRESS_GID:?SECONDBOX_STRESS_GID is required}"
    command: ["/opt/secondbox/secondboxd"]
    depends_on:
      postgres:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    environment:
      SECONDBOX_PLATFORM_TOKEN: ${SECONDBOX_STRESS_PLATFORM_TOKEN:?SECONDBOX_STRESS_PLATFORM_TOKEN is required}
      SECONDBOX_DATABASE_URL: postgresql://secondbox:${SECONDBOX_STRESS_POSTGRES_PASSWORD:?SECONDBOX_STRESS_POSTGRES_PASSWORD is required}@postgres:5432/secondbox_stress?sslmode=disable
      SECONDBOX_DEFAULT_SUBJECT_MAX_ACTIVE_INSTANCES: ${SECONDBOX_STRESS_SUBJECT_MAX_ACTIVE_INSTANCES:?SECONDBOX_STRESS_SUBJECT_MAX_ACTIVE_INSTANCES is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_ARTIFACTS: ${SECONDBOX_STRESS_SUBJECT_MAX_ARTIFACTS:?SECONDBOX_STRESS_SUBJECT_MAX_ARTIFACTS is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_CONCURRENT_OPERATIONS: ${SECONDBOX_STRESS_SUBJECT_MAX_CONCURRENT_OPERATIONS:?SECONDBOX_STRESS_SUBJECT_MAX_CONCURRENT_OPERATIONS is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_CPU_MILLIS: ${SECONDBOX_STRESS_SUBJECT_MAX_CPU_MILLIS:?SECONDBOX_STRESS_SUBJECT_MAX_CPU_MILLIS is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_MEMORY_BYTES: ${SECONDBOX_STRESS_SUBJECT_MAX_MEMORY_BYTES:?SECONDBOX_STRESS_SUBJECT_MAX_MEMORY_BYTES is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_PORT_SESSIONS: ${SECONDBOX_STRESS_SUBJECT_MAX_PORT_SESSIONS:?SECONDBOX_STRESS_SUBJECT_MAX_PORT_SESSIONS is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_ARTIFACT_BYTES: ${SECONDBOX_STRESS_SUBJECT_MAX_ARTIFACT_BYTES:?SECONDBOX_STRESS_SUBJECT_MAX_ARTIFACT_BYTES is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_SANDBOXES: ${SECONDBOX_STRESS_SUBJECT_MAX_SANDBOXES:?SECONDBOX_STRESS_SUBJECT_MAX_SANDBOXES is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_SNAPSHOTS: ${SECONDBOX_STRESS_SUBJECT_MAX_SNAPSHOTS:?SECONDBOX_STRESS_SUBJECT_MAX_SNAPSHOTS is required}
      SECONDBOX_HTTP_TIMEOUT_SECONDS: "70"
      SECONDBOX_DATA_PLANE_POLL_INTERVAL_MILLISECONDS: "100"
      SECONDBOX_DATA_PLANE_CLAIM_DURATION_MILLISECONDS: "30000"
      SECONDBOX_DATA_PLANE_RETENTION_SECONDS: "86400"
      SECONDBOX_DATA_PLANE_MAXIMUM_FRAME_BYTES: "1048576"
      SECONDBOX_DATA_PLANE_MAXIMUM_SESSION_BYTES: "1073741824"
      SECONDBOX_LIFECYCLE_RECONCILE_POLL_INTERVAL_MILLISECONDS: "100"
      SECONDBOX_LIFECYCLE_RECONCILE_CLAIM_DURATION_MILLISECONDS: "30000"
      SECONDBOX_ASSIGNMENT_CLAIM_DURATION_MILLISECONDS: "30000"
      SECONDBOX_ASSIGNMENT_DEADLINE_MILLISECONDS: "120000"
      SECONDBOX_ASSIGNMENT_RETRY_LIMIT: "2"
      SECONDBOX_SCHEDULER_SERIALIZATION_RETRY_LIMIT: "3"
      SECONDBOX_RUNNER_HEARTBEAT_TIMEOUT_MILLISECONDS: "30000"
      SECONDBOX_SIGNED_ASSET_CATALOG_PATH: /opt/secondbox/signed-assets.json
      SECONDBOX_OBJECT_STORE_ENDPOINT: http://object-store:9000
      SECONDBOX_OBJECT_STORE_REGION: us-east-1
      SECONDBOX_OBJECT_STORE_BUCKET: secondbox-stress
      SECONDBOX_OBJECT_STORE_ROOT_USER: ${SECONDBOX_STRESS_OBJECT_STORE_USER:?SECONDBOX_STRESS_OBJECT_STORE_USER is required}
      SECONDBOX_OBJECT_STORE_ROOT_PASSWORD: ${SECONDBOX_STRESS_OBJECT_STORE_PASSWORD:?SECONDBOX_STRESS_OBJECT_STORE_PASSWORD is required}
      SECONDBOX_OBJECT_STORE_USE_PATH_STYLE: "true"
      SECONDBOX_OBJECT_STORE_RETRY_MAX_ATTEMPTS: "3"
      SECONDBOX_OBJECT_STORE_HTTP_TIMEOUT_MILLISECONDS: "30000"
      SECONDBOX_OBJECT_STORE_TEMP_DIRECTORY: /tmp
      SECONDBOX_OBJECT_STORE_MAX_OBJECT_BYTES: "10737418240"
      SECONDBOX_LISTEN_ADDR: 0.0.0.0:8080
      SECONDBOX_PUBLIC_BASE_URL: http://127.0.0.1:${SECONDBOX_STRESS_API_PORT:?SECONDBOX_STRESS_API_PORT is required}
      SECONDBOX_LOG_PATH: /tmp/secondbox-stress-control-plane.jsonl
      SECONDBOX_RUNNER_CA_CERTIFICATE: /opt/secondbox/pki/runner-ca.crt
      SECONDBOX_RUNNER_COMMAND_POLL_INTERVAL_MILLISECONDS: "100"
      SECONDBOX_RUNNER_CREDENTIAL: ${SECONDBOX_STRESS_RUNNER_CREDENTIAL:?SECONDBOX_STRESS_RUNNER_CREDENTIAL is required}
      SECONDBOX_RUNNER_ENABLED_FEATURES: exec-streaming,file-streaming,pty,evidence,local-workspace,port-proxy
      SECONDBOX_RUNNER_HEARTBEAT_INTERVAL_MILLISECONDS: "1000"
      SECONDBOX_RUNNER_LISTEN_ADDR: 0.0.0.0:9443
      SECONDBOX_RUNNER_PROTOCOL_MAXIMUM: "1"
      SECONDBOX_RUNNER_PROTOCOL_MINIMUM: "1"
      SECONDBOX_RUNNER_SERVER_CERTIFICATE: /opt/secondbox/pki/server.crt
      SECONDBOX_RUNNER_SERVER_PRIVATE_KEY: /opt/secondbox/pki/server.key
    ports:
      - "127.0.0.1:${SECONDBOX_STRESS_API_PORT:?SECONDBOX_STRESS_API_PORT is required}:8080"
      - "127.0.0.1:${SECONDBOX_STRESS_RUNNER_PORT:?SECONDBOX_STRESS_RUNNER_PORT is required}:9443"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status":"ready"' <&3
      interval: 1s
      timeout: 5s
      retries: 120
    volumes:
      - ${SECONDBOX_STRESS_CONTROL_PLANE_BINARY:?SECONDBOX_STRESS_CONTROL_PLANE_BINARY is required}:/opt/secondbox/secondboxd:ro
      - ${SECONDBOX_STRESS_PKI_DIR:?SECONDBOX_STRESS_PKI_DIR is required}:/opt/secondbox/pki:ro
      - ${SECONDBOX_STRESS_ASSET_CATALOG:?SECONDBOX_STRESS_ASSET_CATALOG is required}:/opt/secondbox/signed-assets.json:ro
    networks:
      - scenario

  secondbox-runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
    depends_on:
      control-plane:
        condition: service_healthy
    privileged: true
    network_mode: host
    cgroup: host
    environment:
      SECONDBOX_RUNNER_ID: secondbox-stress-runner
      SECONDBOX_RUNNER_POOL_ID: ${SECONDBOX_STRESS_RUNNER_POOL_NAME:?SECONDBOX_STRESS_RUNNER_POOL_NAME is required}
      SECONDBOX_RUNNER_SOFTWARE_VERSION: stress-local
      SECONDBOX_RUNNER_CONTROL_PLANE_ADDRESS: 127.0.0.1:${SECONDBOX_STRESS_RUNNER_PORT:?SECONDBOX_STRESS_RUNNER_PORT is required}
      SECONDBOX_RUNNER_CONTROL_PLANE_SERVER_NAME: localhost
      SECONDBOX_RUNNER_CREDENTIAL: ${SECONDBOX_STRESS_RUNNER_CREDENTIAL:?SECONDBOX_STRESS_RUNNER_CREDENTIAL is required}
      SECONDBOX_RUNNER_CLIENT_CERTIFICATE: /run/secondbox-runner-identity/runner.crt
      SECONDBOX_RUNNER_CLIENT_KEY: /run/secondbox-runner-identity/runner.key
      SECONDBOX_RUNNER_CONTROL_PLANE_CA: /run/secondbox-runner-identity/runner-ca.crt
      SECONDBOX_RUNNER_LOG_PATH: /var/lib/secondbox-runner/log/runner.jsonl
      SECONDBOX_RUNNER_LOG_DIR: /var/lib/secondbox-runner/log
      SECONDBOX_RUNNER_FIRECRACKER_PATH: /usr/local/bin/firecracker
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_PATH: /usr/local/bin/jailer
      SECONDBOX_RUNNER_FIRECRACKER_JAIL_ROOT: /var/lib/secondbox-runner/jailer
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID: "10001"
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_GID: "10001"
      SECONDBOX_RUNNER_FIRECRACKER_CGROUP_VERSION: "2"
      SECONDBOX_RUNNER_FIRECRACKER_CGROUP_PARENT: secondbox-stress
      SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH: /opt/secondbox-artifacts/kernel
      SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH: /opt/secondbox-artifacts/rootfs.ext4
      SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH: /opt/secondbox-artifacts/shared.img
      SECONDBOX_RUNNER_FIRECRACKER_KERNEL_ARGS: ${SECONDBOX_STRESS_FIRECRACKER_KERNEL_ARGS:?SECONDBOX_STRESS_FIRECRACKER_KERNEL_ARGS is required}
      SECONDBOX_RUNNER_FIRECRACKER_CPU_TEMPLATE: ${SECONDBOX_STRESS_FIRECRACKER_CPU_TEMPLATE:?SECONDBOX_STRESS_FIRECRACKER_CPU_TEMPLATE is required}
      SECONDBOX_RUNNER_FIRECRACKER_RUN_DIR: /var/lib/secondbox-runner/run
      SECONDBOX_RUNNER_FIRECRACKER_LOG_DIR: /var/lib/secondbox-runner/firecracker-log
      SECONDBOX_RUNNER_FIRECRACKER_ALLOW_UNJAILED: "false"
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY: /run/secondbox-artifact-trust/public-key.pem
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256: ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256:?SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256 is required}
      SECONDBOX_RUNNER_WORKSPACE_ROOT: /var/lib/secondbox-runner/workspaces
      SECONDBOX_RUNNER_STORAGE_PRESSURE_RECOVERY_PERCENT: ${SECONDBOX_STRESS_STORAGE_RECOVERY_PERCENT:?SECONDBOX_STRESS_STORAGE_RECOVERY_PERCENT is required}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_WARNING_PERCENT: ${SECONDBOX_STRESS_STORAGE_WARNING_PERCENT:?SECONDBOX_STRESS_STORAGE_WARNING_PERCENT is required}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_ADMISSION_DENY_PERCENT: ${SECONDBOX_STRESS_STORAGE_DENY_PERCENT:?SECONDBOX_STRESS_STORAGE_DENY_PERCENT is required}
      SECONDBOX_RUNNER_SANDBOX_MAX_VCPUS: ${SECONDBOX_STRESS_SANDBOX_MAX_VCPUS:?SECONDBOX_STRESS_SANDBOX_MAX_VCPUS is required}
      SECONDBOX_RUNNER_SANDBOX_MAX_MEMORY_MIB: ${SECONDBOX_STRESS_SANDBOX_MEMORY_MIB:?SECONDBOX_STRESS_SANDBOX_MEMORY_MIB is required}
      SECONDBOX_RUNNER_SANDBOX_MAX_DISK_MIB: ${SECONDBOX_STRESS_SANDBOX_DISK_MIB:?SECONDBOX_STRESS_SANDBOX_DISK_MIB is required}
      SECONDBOX_RUNNER_SANDBOX_MEMORY_BUDGET_MIB: ${SECONDBOX_STRESS_MEMORY_BUDGET_MIB:?SECONDBOX_STRESS_MEMORY_BUDGET_MIB is required}
      SECONDBOX_RUNNER_SANDBOX_GUEST_IP: ${SECONDBOX_STRESS_GUEST_IP:?SECONDBOX_STRESS_GUEST_IP is required}
      SECONDBOX_RUNNER_SANDBOX_BRIDGE_NAME: ${SECONDBOX_STRESS_BRIDGE_NAME:?SECONDBOX_STRESS_BRIDGE_NAME is required}
      SECONDBOX_RUNNER_SANDBOX_BRIDGE_CIDR: ${SECONDBOX_STRESS_BRIDGE_CIDR:?SECONDBOX_STRESS_BRIDGE_CIDR is required}
      SECONDBOX_RUNNER_SANDBOX_GUEST_CIDR: ${SECONDBOX_STRESS_GUEST_CIDR:?SECONDBOX_STRESS_GUEST_CIDR is required}
      SECONDBOX_RUNNER_SANDBOX_TAP_PREFIX: ${SECONDBOX_STRESS_TAP_PREFIX:?SECONDBOX_STRESS_TAP_PREFIX is required}
      SECONDBOX_RUNNER_SANDBOX_NETWORK_STATE_DIR: /var/lib/secondbox-runner/network
      SECONDBOX_RUNNER_SANDBOX_DELETE_BRIDGE: "true"
      SECONDBOX_RUNNER_NETWORK_POLICY_NFT_PATH: /usr/sbin/nft
      SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_PINS: "256"
      SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_TTL: 5m
      SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_ADDRESSES: ${SECONDBOX_STRESS_BRIDGE_ADDRESS:?SECONDBOX_STRESS_BRIDGE_ADDRESS is required}
      SECONDBOX_RUNNER_NETWORK_POLICY_MANAGEMENT_CIDRS: ${SECONDBOX_STRESS_GUEST_CIDR:?SECONDBOX_STRESS_GUEST_CIDR is required}
      SECONDBOX_RUNNER_NETWORK_POLICY_DNS_UPSTREAM: 1.1.1.1:53
      SECONDBOX_RUNNER_MAX_CONCURRENT_PER_SANDBOX: ${SECONDBOX_STRESS_MAX_CONCURRENT_PER_SANDBOX:?SECONDBOX_STRESS_MAX_CONCURRENT_PER_SANDBOX is required}
      SECONDBOX_RUNNER_MAX_CONCURRENT_GLOBAL: ${SECONDBOX_STRESS_MAX_CONCURRENT_GLOBAL:?SECONDBOX_STRESS_MAX_CONCURRENT_GLOBAL is required}
      SECONDBOX_RUNNER_FILE_TRANSFER_MAX_BYTES: ${SECONDBOX_STRESS_FILE_TRANSFER_MAX_BYTES:?SECONDBOX_STRESS_FILE_TRANSFER_MAX_BYTES is required}
      SECONDBOX_RUNNER_GUEST_CONTROL_VSOCK_PORT: "1024"
      SECONDBOX_RUNNER_GUEST_PROTOCOL_VSOCK_PORT: "1025"
      SECONDBOX_RUNNER_GUEST_HEARTBEAT_INTERVAL: 5s
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${SECONDBOX_STRESS_RUNNER_IDENTITY_DIR:?SECONDBOX_STRESS_RUNNER_IDENTITY_DIR is required}:/run/secondbox-runner-identity:ro
      - ${SECONDBOX_SCENARIO_MICROVM_ARTIFACTS_DIR:?SECONDBOX_SCENARIO_MICROVM_ARTIFACTS_DIR is required}:/opt/secondbox-artifacts:ro
      - ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY:?SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY is required}:/run/secondbox-artifact-trust/public-key.pem:ro
      - ${SECONDBOX_STRESS_RUNNER_STATE_DIR:?SECONDBOX_STRESS_RUNNER_STATE_DIR is required}:/var/lib/secondbox-runner:rshared
      - ${SECONDBOX_STRESS_RUNNER_WORKSPACE_DIR:?SECONDBOX_STRESS_RUNNER_WORKSPACE_DIR is required}:/var/lib/secondbox-runner/workspaces:rshared
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test: ["CMD", "/usr/local/bin/secondbox-runner", "-healthcheck", "-healthcheck-timeout", "5s"]
      interval: 2s
      timeout: 6s
      retries: 30
      start_period: 15s

networks:
  scenario:
    driver: bridge
