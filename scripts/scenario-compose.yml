services:
  postgres:
    image: docker.io/library/postgres:18.4-bookworm
    environment:
      POSTGRES_DB: secondbox_scenario
      POSTGRES_PASSWORD: secondbox-scenario-password
      POSTGRES_USER: secondbox
    ports:
      - "127.0.0.1:${SECONDBOX_SCENARIO_DATABASE_PORT:?SECONDBOX_SCENARIO_DATABASE_PORT is required}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 "$$PGDATA/postmaster.pid")" = "1" &&
          pg_isready -U secondbox -d secondbox_scenario
      interval: 1s
      timeout: 5s
      retries: 60

  control-plane:
    image: docker.io/library/golang:1.25.12-bookworm
    user: "${SECONDBOX_SCENARIO_UID:?SECONDBOX_SCENARIO_UID is required}:${SECONDBOX_SCENARIO_GID:?SECONDBOX_SCENARIO_GID is required}"
    command: ["/opt/secondbox/secondboxd"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECONDBOX_PLATFORM_TOKEN: ${SECONDBOX_PLATFORM_TOKEN:?SECONDBOX_PLATFORM_TOKEN is required}
      SECONDBOX_DATABASE_URL: postgresql://secondbox:secondbox-scenario-password@postgres:5432/secondbox_scenario?sslmode=disable
      SECONDBOX_DEFAULT_SUBJECT_MAX_ACTIVE_INSTANCES: ${SECONDBOX_SCENARIO_SUBJECT_MAX_ACTIVE_INSTANCES:?SECONDBOX_SCENARIO_SUBJECT_MAX_ACTIVE_INSTANCES is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_CONCURRENT_OPERATIONS: ${SECONDBOX_SCENARIO_SUBJECT_MAX_CONCURRENT_OPERATIONS:?SECONDBOX_SCENARIO_SUBJECT_MAX_CONCURRENT_OPERATIONS is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_VCPU_COUNT: ${SECONDBOX_SCENARIO_SUBJECT_MAX_VCPU_COUNT:?SECONDBOX_SCENARIO_SUBJECT_MAX_VCPU_COUNT is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_MEMORY_BYTES: ${SECONDBOX_SCENARIO_SUBJECT_MAX_MEMORY_BYTES:?SECONDBOX_SCENARIO_SUBJECT_MAX_MEMORY_BYTES is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_PORT_SESSIONS: ${SECONDBOX_SCENARIO_SUBJECT_MAX_PORT_SESSIONS:?SECONDBOX_SCENARIO_SUBJECT_MAX_PORT_SESSIONS is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_SANDBOXES: ${SECONDBOX_SCENARIO_SUBJECT_MAX_SANDBOXES:?SECONDBOX_SCENARIO_SUBJECT_MAX_SANDBOXES is required}
      SECONDBOX_DEFAULT_SUBJECT_MAX_SNAPSHOTS: ${SECONDBOX_SCENARIO_SUBJECT_MAX_SNAPSHOTS:?SECONDBOX_SCENARIO_SUBJECT_MAX_SNAPSHOTS is required}
      SECONDBOX_HTTP_TIMEOUT_SECONDS: ${SECONDBOX_SCENARIO_HTTP_TIMEOUT_SECONDS:?SECONDBOX_SCENARIO_HTTP_TIMEOUT_SECONDS is required}
      SECONDBOX_DATA_PLANE_POLL_INTERVAL_MILLISECONDS: ${SECONDBOX_SCENARIO_DATA_PLANE_POLL_INTERVAL_MILLISECONDS:?SECONDBOX_SCENARIO_DATA_PLANE_POLL_INTERVAL_MILLISECONDS is required}
      SECONDBOX_DATA_PLANE_RETENTION_SECONDS: "3600"
      SECONDBOX_DATA_PLANE_MAXIMUM_SESSION_BYTES: "16777216"
      SECONDBOX_LIFECYCLE_RECONCILE_POLL_INTERVAL_MILLISECONDS: "100"
      SECONDBOX_LIFECYCLE_RECONCILE_CLAIM_DURATION_MILLISECONDS: "5000"
      SECONDBOX_LIFECYCLE_RECONCILE_BATCH_SIZE: "8"
      SECONDBOX_ASSIGNMENT_CLAIM_DURATION_MILLISECONDS: ${SECONDBOX_SCENARIO_ASSIGNMENT_CLAIM_MILLISECONDS:?SECONDBOX_SCENARIO_ASSIGNMENT_CLAIM_MILLISECONDS is required}
      SECONDBOX_ASSIGNMENT_DEADLINE_MILLISECONDS: ${SECONDBOX_SCENARIO_ASSIGNMENT_DEADLINE_MILLISECONDS:?SECONDBOX_SCENARIO_ASSIGNMENT_DEADLINE_MILLISECONDS is required}
      SECONDBOX_ASSIGNMENT_RETRY_LIMIT: "2"
      SECONDBOX_SCHEDULER_SERIALIZATION_RETRY_LIMIT: "3"
      SECONDBOX_RUNNER_HEARTBEAT_TIMEOUT_MILLISECONDS: ${SECONDBOX_SCENARIO_RUNNER_HEARTBEAT_TIMEOUT_MILLISECONDS:?SECONDBOX_SCENARIO_RUNNER_HEARTBEAT_TIMEOUT_MILLISECONDS is required}
      SECONDBOX_SIGNED_ASSET_CATALOG_PATH: /opt/secondbox/signed-assets.json
      SECONDBOX_LISTEN_ADDR: "0.0.0.0:8080"
      SECONDBOX_PUBLIC_BASE_URL: "http://127.0.0.1:${SECONDBOX_SCENARIO_API_PORT:?SECONDBOX_SCENARIO_API_PORT is required}"
      SECONDBOX_LOG_PATH: /tmp/secondbox-scenario.log
      SECONDBOX_RUNNER_CA_CERTIFICATE: /opt/secondbox/pki/runner-ca.crt
      SECONDBOX_RUNNER_COMMAND_DELIVERY_BATCH_SIZE: "16"
      SECONDBOX_RUNNER_COMMAND_POLL_INTERVAL_MILLISECONDS: "100"
      SECONDBOX_RUNNER_EVENT_PERSISTENCE_BATCH_SIZE: "16"
      SECONDBOX_RUNNER_EVENT_PERSISTENCE_BATCH_WAIT_MILLISECONDS: "2"
      SECONDBOX_RUNNER_CREDENTIAL: ${SECONDBOX_SCENARIO_RUNNER_CREDENTIAL:?SECONDBOX_SCENARIO_RUNNER_CREDENTIAL is required}
      SECONDBOX_RUNNER_ENABLED_FEATURES: exec-streaming,file-streaming,pty,evidence,local-workspace,port-proxy
      SECONDBOX_RUNNER_HEARTBEAT_INTERVAL_MILLISECONDS: "1000"
      SECONDBOX_RUNNER_LISTEN_ADDR: "0.0.0.0:9443"
      SECONDBOX_RUNNER_SERVER_CERTIFICATE: /opt/secondbox/pki/server.crt
      SECONDBOX_RUNNER_SERVER_PRIVATE_KEY: /opt/secondbox/pki/server.key
    ports:
      - "127.0.0.1:${SECONDBOX_SCENARIO_API_PORT}:8080"
      - "127.0.0.1:${SECONDBOX_SCENARIO_RUNNER_PORT}:9443"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status":"ready"' <&3
      interval: 1s
      timeout: 5s
      retries: 90
    volumes:
      - ../.tmp/scenario/secondboxd:/opt/secondbox/secondboxd:ro
      - ${SECONDBOX_SCENARIO_PKI_DIR:?SECONDBOX_SCENARIO_PKI_DIR is required}:/opt/secondbox/pki:ro
      - ${SECONDBOX_SCENARIO_ASSET_CATALOG:?SECONDBOX_SCENARIO_ASSET_CATALOG is required}:/opt/secondbox/signed-assets.json:ro

  secondbox-runner:
    image: ${SECONDBOX_SCENARIO_RUNNER_IMAGE:?SECONDBOX_SCENARIO_RUNNER_IMAGE is required}
    entrypoint: ["/usr/local/bin/secondbox-scenario-runner-entrypoint"]
    command: []
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      control-plane:
        condition: service_healthy
    privileged: true
    network_mode: host
    cgroup: host
    labels:
      org.secondbox.runner.qualification: scenario-suite
    environment: &scenario-runner-environment
      SECONDBOX_RUNNER_ID: ${SECONDBOX_RUNNER_ID:?SECONDBOX_RUNNER_ID is required}
      SECONDBOX_RUNNER_POOL_ID: ${SECONDBOX_RUNNER_POOL_ID:?SECONDBOX_RUNNER_POOL_ID is required}
      SECONDBOX_RUNNER_SOFTWARE_VERSION: ${SECONDBOX_SCENARIO_SOURCE_COMMIT:?SECONDBOX_SCENARIO_SOURCE_COMMIT is required}
      SECONDBOX_RUNNER_CONTROL_PLANE_ADDRESS: "127.0.0.1:${SECONDBOX_SCENARIO_RUNNER_PORT:?SECONDBOX_SCENARIO_RUNNER_PORT is required}"
      SECONDBOX_RUNNER_CONTROL_PLANE_SERVER_NAME: localhost
      SECONDBOX_RUNNER_CREDENTIAL: ${SECONDBOX_SCENARIO_RUNNER_CREDENTIAL:?SECONDBOX_SCENARIO_RUNNER_CREDENTIAL is required}
      SECONDBOX_RUNNER_CLIENT_CERTIFICATE: ${SECONDBOX_SCENARIO_RUNNER_CLIENT_CERTIFICATE:?SECONDBOX_SCENARIO_RUNNER_CLIENT_CERTIFICATE is required}
      SECONDBOX_RUNNER_CLIENT_KEY: /opt/secondbox-runner-identity/runner.key
      SECONDBOX_RUNNER_CONTROL_PLANE_CA: /opt/secondbox-runner-identity/runner-ca.crt
      SECONDBOX_RUNNER_LOG_PATH: /var/lib/secondbox-runner/log/runner.jsonl
      SECONDBOX_RUNNER_LOG_DIR: /var/lib/secondbox-runner/log
      SECONDBOX_RUNNER_FIRECRACKER_PATH: /usr/local/bin/firecracker
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_PATH: /usr/local/bin/jailer
      SECONDBOX_RUNNER_FIRECRACKER_JAIL_ROOT: /w/jailer-root
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_START: "10001"
      # One jailer UID per concurrently resident Instance. The Runner refuses to
      # start when this pool is smaller than its Instance capacity, so binding
      # both to the same required variable keeps a capacity run from failing on
      # a constant that silently disagreed with its configuration.
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_COUNT: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_GLOBAL:?SECONDBOX_SCENARIO_MAX_CONCURRENT_GLOBAL is required}
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_UID_ALLOW_BELOW_1000: "false"
      SECONDBOX_RUNNER_FIRECRACKER_JAILER_GID: "10001"
      SECONDBOX_RUNNER_FIRECRACKER_CGROUP_VERSION: "2"
      SECONDBOX_RUNNER_FIRECRACKER_CGROUP_PARENT: ${SECONDBOX_SCENARIO_CGROUP_PARENT:?SECONDBOX_SCENARIO_CGROUP_PARENT is required}
      SECONDBOX_RUNNER_FIRECRACKER_KERNEL_PATH: /opt/secondbox-artifacts/kernel
      SECONDBOX_RUNNER_FIRECRACKER_ROOTFS_PATH: /opt/secondbox-artifacts/rootfs.ext4
      SECONDBOX_RUNNER_FIRECRACKER_SHARED_IMAGE_PATH: /opt/secondbox-artifacts/shared.img
      SECONDBOX_RUNNER_FIRECRACKER_KERNEL_ARGS: console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda rw quiet loglevel=1 i8042.noaux i8042.nomux i8042.nopnp i8042.dumbkbd init=/init
      SECONDBOX_RUNNER_FIRECRACKER_CPU_TEMPLATE: None
      SECONDBOX_RUNNER_FIRECRACKER_RUN_DIR: /var/lib/secondbox-runner/run
      SECONDBOX_RUNNER_FIRECRACKER_LOG_DIR: /var/lib/secondbox-runner/firecracker-log
      SECONDBOX_RUNNER_FIRECRACKER_ALLOW_UNJAILED: "false"
      # The resume template cache must share a filesystem with the jail root so
      # a golden memory file can be hard-linked into each jail and keep one
      # inode and one page cache across concurrent resumes.
      SECONDBOX_RUNNER_SNAPSHOT_TEMPLATE_CACHE_ROOT: /w/snapshot-templates
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY: /opt/secondbox-artifact-public-key.pem
      SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256: ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256:?SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY_SHA256 is required}
      SECONDBOX_RUNNER_WORKSPACE_ROOT: /w
      SECONDBOX_RUNNER_STORAGE_PRESSURE_RECOVERY_PERCENT: ${SECONDBOX_SCENARIO_STORAGE_RECOVERY_PERCENT:?SECONDBOX_SCENARIO_STORAGE_RECOVERY_PERCENT is required}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_WARNING_PERCENT: ${SECONDBOX_SCENARIO_STORAGE_WARNING_PERCENT:?SECONDBOX_SCENARIO_STORAGE_WARNING_PERCENT is required}
      SECONDBOX_RUNNER_STORAGE_PRESSURE_ADMISSION_DENY_PERCENT: ${SECONDBOX_SCENARIO_STORAGE_DENY_PERCENT:?SECONDBOX_SCENARIO_STORAGE_DENY_PERCENT is required}
      SECONDBOX_RUNNER_SANDBOX_MAX_VCPUS: ${SECONDBOX_SCENARIO_SANDBOX_MAX_VCPUS:?SECONDBOX_SCENARIO_SANDBOX_MAX_VCPUS is required}
      SECONDBOX_RUNNER_SANDBOX_MAX_MEMORY_MIB: ${SECONDBOX_SCENARIO_SANDBOX_MEMORY_MIB:?SECONDBOX_SCENARIO_SANDBOX_MEMORY_MIB is required}
      SECONDBOX_RUNNER_SANDBOX_MAX_DISK_MIB: ${SECONDBOX_SCENARIO_SANDBOX_DISK_MIB:?SECONDBOX_SCENARIO_SANDBOX_DISK_MIB is required}
      SECONDBOX_RUNNER_SANDBOX_MEMORY_BUDGET_MIB: ${SECONDBOX_SCENARIO_MEMORY_BUDGET_MIB:?SECONDBOX_SCENARIO_MEMORY_BUDGET_MIB is required}
      SECONDBOX_RUNNER_SANDBOX_GUEST_IP: ${SECONDBOX_SCENARIO_GUEST_IP:?SECONDBOX_SCENARIO_GUEST_IP is required}
      SECONDBOX_RUNNER_SANDBOX_BRIDGE_NAME: ${SECONDBOX_SCENARIO_BRIDGE_NAME:?SECONDBOX_SCENARIO_BRIDGE_NAME is required}
      SECONDBOX_RUNNER_SANDBOX_BRIDGE_CIDR: ${SECONDBOX_SCENARIO_BRIDGE_CIDR:?SECONDBOX_SCENARIO_BRIDGE_CIDR is required}
      SECONDBOX_RUNNER_SANDBOX_GUEST_CIDR: ${SECONDBOX_SCENARIO_GUEST_CIDR:?SECONDBOX_SCENARIO_GUEST_CIDR is required}
      SECONDBOX_RUNNER_SANDBOX_TAP_PREFIX: ${SECONDBOX_SCENARIO_TAP_PREFIX:?SECONDBOX_SCENARIO_TAP_PREFIX is required}
      SECONDBOX_RUNNER_SANDBOX_NETWORK_STATE_DIR: /var/lib/secondbox-runner/network
      SECONDBOX_RUNNER_SANDBOX_DELETE_BRIDGE: "true"
      SECONDBOX_RUNNER_NETWORK_POLICY_NFT_PATH: /usr/sbin/nft
      SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_PINS: "256"
      SECONDBOX_RUNNER_NETWORK_POLICY_MAX_DNS_TTL: 5m
      SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_ADDRESSES: ${SECONDBOX_SCENARIO_BRIDGE_ADDRESS:?SECONDBOX_SCENARIO_BRIDGE_ADDRESS is required}
      SECONDBOX_RUNNER_NETWORK_POLICY_MANAGEMENT_CIDRS: ${SECONDBOX_SCENARIO_GUEST_CIDR:?SECONDBOX_SCENARIO_GUEST_CIDR is required}
      SECONDBOX_RUNNER_NETWORK_POLICY_RUNNER_GATEWAYS: agent-gateway.secondbox.internal=${SECONDBOX_SCENARIO_BRIDGE_ADDRESS:?SECONDBOX_SCENARIO_BRIDGE_ADDRESS is required}
      SECONDBOX_RUNNER_NETWORK_POLICY_DNS_UPSTREAM: 1.1.1.1:53
      SECONDBOX_RUNNER_MAX_CONCURRENT_PER_SANDBOX: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_PER_SANDBOX:?SECONDBOX_SCENARIO_MAX_CONCURRENT_PER_SANDBOX is required}
      SECONDBOX_RUNNER_MAX_CONCURRENT_GLOBAL: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_GLOBAL:?SECONDBOX_SCENARIO_MAX_CONCURRENT_GLOBAL is required}
      SECONDBOX_RUNNER_MAX_CONCURRENT_STARTS: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_STARTS:?SECONDBOX_SCENARIO_MAX_CONCURRENT_STARTS is required}
      SECONDBOX_RUNNER_MAX_CONCURRENT_WORKSPACE_CREATES: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_WORKSPACE_CREATES:?SECONDBOX_SCENARIO_MAX_CONCURRENT_WORKSPACE_CREATES is required}
      SECONDBOX_RUNNER_MAX_CONCURRENT_OPERATIONS_GLOBAL: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_OPERATIONS_GLOBAL:?SECONDBOX_SCENARIO_MAX_CONCURRENT_OPERATIONS_GLOBAL is required}
      SECONDBOX_RUNNER_FILE_TRANSFER_MAX_BYTES: ${SECONDBOX_SCENARIO_FILE_TRANSFER_MAX_BYTES:?SECONDBOX_SCENARIO_FILE_TRANSFER_MAX_BYTES is required}
      SECONDBOX_RUNNER_GUEST_CONTROL_VSOCK_PORT: "1024"
      SECONDBOX_RUNNER_GUEST_PROTOCOL_VSOCK_PORT: "1025"
      SECONDBOX_RUNNER_GUEST_HEARTBEAT_INTERVAL: ${SECONDBOX_SCENARIO_RUNNER_GUEST_HEARTBEAT_INTERVAL:?SECONDBOX_SCENARIO_RUNNER_GUEST_HEARTBEAT_INTERVAL is required}
      SECONDBOX_RUNNER_DATA_PLANE_LISTEN_ADDRESS: "0.0.0.0:${SECONDBOX_SCENARIO_RUNNER_DATA_PLANE_PORT:?SECONDBOX_SCENARIO_RUNNER_DATA_PLANE_PORT is required}"
      SECONDBOX_RUNNER_DATA_PLANE_ADVERTISED_ADDRESS: "127.0.0.1:${SECONDBOX_SCENARIO_RUNNER_DATA_PLANE_PORT:?SECONDBOX_SCENARIO_RUNNER_DATA_PLANE_PORT is required}"
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./scenario-runner-entrypoint.sh:/usr/local/bin/secondbox-scenario-runner-entrypoint:ro
      - ${SECONDBOX_SCENARIO_IDENTITY_DIR:?SECONDBOX_SCENARIO_IDENTITY_DIR is required}:/opt/secondbox-runner-identity:ro
      - ${SECONDBOX_SCENARIO_MICROVM_ARTIFACTS_DIR:?SECONDBOX_SCENARIO_MICROVM_ARTIFACTS_DIR is required}:/opt/secondbox-artifacts:ro
      - ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY:?SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY is required}:/opt/secondbox-artifact-public-key.pem:ro
      - ${SECONDBOX_SCENARIO_STATE_DIR:?SECONDBOX_SCENARIO_STATE_DIR is required}:/var/lib/secondbox-runner:rshared
      - ${SECONDBOX_SCENARIO_WORKSPACE_DIR:?SECONDBOX_SCENARIO_WORKSPACE_DIR is required}:/w:rshared
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/secondbox-runner
        - -healthcheck
        - -healthcheck-timeout
        - 5s
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 15s

  # The interim operator flow for a populated resume cache. A Runner does not
  # build its own snapshot-resume templates yet, so one is published into
  # SECONDBOX_RUNNER_SNAPSHOT_TEMPLATE_CACHE_ROOT before the Runner starts.
  #
  # It runs with the Runner's exact environment, so the kernel arguments, CPU
  # template, vsock ports, signed bundle, and trust anchor that the template's
  # compatibility key records cannot disagree with the Runner that must resolve
  # it. Only the Profile shape is stated separately, because that is the
  # operator's choice rather than the Runner's.
  #
  # It has its own network namespace: the template's capture creates a bridge and
  # a TAP, and doing that on the host before the Runner has installed its own
  # host networking would collide with it. The bridge name is not part of the
  # compatibility key — only the presence of the device and its captured MAC are
  # — so a private namespace changes nothing about the template.
  snapshot-template-publisher:
    image: ${SECONDBOX_SCENARIO_RUNNER_IMAGE:?SECONDBOX_SCENARIO_RUNNER_IMAGE is required}
    entrypoint: ["/bin/bash", "/usr/local/bin/secondbox-scenario-publish-snapshot-template"]
    command: []
    privileged: true
    network_mode: none
    cgroup: host
    labels:
      org.secondbox.runner.qualification: scenario-snapshot-template
    environment:
      <<: *scenario-runner-environment
      SECONDBOX_RUNNER_PUBLISH_SNAPSHOT_TEMPLATE: "1"
      SECONDBOX_SNAPSHOT_TEMPLATE_PUBLISH_BUILD_ROOT: /w/.template-build
      SECONDBOX_SNAPSHOT_TEMPLATE_PUBLISH_OUTPUT: /w/.template-build/published.json
      SECONDBOX_SNAPSHOT_TEMPLATE_PUBLISH_MEMORY_MIB: ${SECONDBOX_SCENARIO_SNAPSHOT_RESUME_MEMORY_MIB:?SECONDBOX_SCENARIO_SNAPSHOT_RESUME_MEMORY_MIB is required}
      SECONDBOX_SNAPSHOT_TEMPLATE_PUBLISH_WORKSPACE_MIB: ${SECONDBOX_SCENARIO_SNAPSHOT_RESUME_WORKSPACE_MIB:?SECONDBOX_SCENARIO_SNAPSHOT_RESUME_WORKSPACE_MIB is required}
      SECONDBOX_SNAPSHOT_TEMPLATE_PUBLISH_VCPUS: ${SECONDBOX_SCENARIO_SNAPSHOT_RESUME_VCPUS:?SECONDBOX_SCENARIO_SNAPSHOT_RESUME_VCPUS is required}
      SECONDBOX_SNAPSHOT_TEMPLATE_PUBLISH_REPORT: /var/lib/secondbox-runner/snapshot-template-publish.json
      TMPDIR: /w/.template-build/tmp
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./scenario-publish-snapshot-template.sh:/usr/local/bin/secondbox-scenario-publish-snapshot-template:ro
      - ../.tmp/scenario/snapshot-template-publish.test:/opt/secondbox-snapshot-template-publish.test:ro
      - ${SECONDBOX_SCENARIO_MICROVM_ARTIFACTS_DIR:?SECONDBOX_SCENARIO_MICROVM_ARTIFACTS_DIR is required}:/opt/secondbox-artifacts:ro
      - ${SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY:?SECONDBOX_RUNNER_ARTIFACT_PUBLIC_KEY is required}:/opt/secondbox-artifact-public-key.pem:ro
      - ${SECONDBOX_SCENARIO_STATE_DIR:?SECONDBOX_SCENARIO_STATE_DIR is required}:/var/lib/secondbox-runner:rshared
      - ${SECONDBOX_SCENARIO_WORKSPACE_DIR:?SECONDBOX_SCENARIO_WORKSPACE_DIR is required}:/w:rshared
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

networks:
  default:
    ipam:
      config:
        - subnet: ${SECONDBOX_SCENARIO_COMPOSE_CIDR:?SECONDBOX_SCENARIO_COMPOSE_CIDR is required}
