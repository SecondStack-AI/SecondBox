x-microsandbox-environment: &microsandbox-environment
  SECONDBOX_MICROSANDBOX_HELPER_EXECUTABLE: /opt/secondbox-microsandbox/runtime/bin/secondbox-microsandbox-helper
  SECONDBOX_MICROSANDBOX_LIBKRUNFW_PATH: /opt/secondbox-microsandbox/runtime/lib/libkrunfw.so.5.6.1
  SECONDBOX_MICROSANDBOX_AGENTD_PATH: /opt/secondbox-microsandbox/runtime/bin/agentd
  SECONDBOX_MICROSANDBOX_FLAT_ROOT_PATH: /opt/secondbox-microsandbox/rootfs
  SECONDBOX_MICROSANDBOX_MATERIALIZATION_PATH: /opt/secondbox-microsandbox-materialization.json
  SECONDBOX_MICROSANDBOX_MATERIALIZATION_DIGEST: ${SECONDBOX_SCENARIO_MICROSANDBOX_MATERIALIZATION_DIGEST:?SECONDBOX_SCENARIO_MICROSANDBOX_MATERIALIZATION_DIGEST is required}
  SECONDBOX_MICROSANDBOX_MAXIMUM_VCPUS: ${SECONDBOX_SCENARIO_MICROSANDBOX_MAXIMUM_VCPUS:?SECONDBOX_SCENARIO_MICROSANDBOX_MAXIMUM_VCPUS is required}
  SECONDBOX_MICROSANDBOX_MAXIMUM_MEMORY_BYTES: ${SECONDBOX_SCENARIO_MICROSANDBOX_MAXIMUM_MEMORY_BYTES:?SECONDBOX_SCENARIO_MICROSANDBOX_MAXIMUM_MEMORY_BYTES is required}
  SECONDBOX_MICROSANDBOX_MAXIMUM_DISK_BYTES: ${SECONDBOX_SCENARIO_MICROSANDBOX_MAXIMUM_DISK_BYTES:?SECONDBOX_SCENARIO_MICROSANDBOX_MAXIMUM_DISK_BYTES is required}
  SECONDBOX_MICROSANDBOX_MAXIMUM_INSTANCES: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_GLOBAL:?SECONDBOX_SCENARIO_MAX_CONCURRENT_GLOBAL is required}
  SECONDBOX_MICROSANDBOX_MAXIMUM_OPERATIONS: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_OPERATIONS_GLOBAL:?SECONDBOX_SCENARIO_MAX_CONCURRENT_OPERATIONS_GLOBAL is required}
  SECONDBOX_MICROSANDBOX_WORKSPACE_TEMPLATE_CAPACITY_BYTES: ${SECONDBOX_SCENARIO_MICROSANDBOX_WORKSPACE_TEMPLATE_CAPACITY_BYTES:?SECONDBOX_SCENARIO_MICROSANDBOX_WORKSPACE_TEMPLATE_CAPACITY_BYTES is required}

services:
  secondbox-runner:
    environment: *microsandbox-environment
    volumes:
      - ${SECONDBOX_SCENARIO_MICROSANDBOX_BUILD:?SECONDBOX_SCENARIO_MICROSANDBOX_BUILD is required}:/opt/secondbox-microsandbox:ro
      - ${SECONDBOX_SCENARIO_MICROSANDBOX_MATERIALIZATION:?SECONDBOX_SCENARIO_MICROSANDBOX_MATERIALIZATION is required}:/opt/secondbox-microsandbox-materialization.json:ro

  secondbox-runner-relocation:
    extends:
      file: ./scenario-compose.yml
      service: secondbox-runner
    profiles: ["relocation"]
    restart: "no"
    labels:
      org.secondbox.runner.qualification: scenario-relocation-target
    environment:
      <<: *microsandbox-environment
      SECONDBOX_RUNNER_ID: ${SECONDBOX_SCENARIO_RELOCATION_RUNNER_ID:?SECONDBOX_SCENARIO_RELOCATION_RUNNER_ID is required}
      SECONDBOX_RUNNER_DATA_PLANE_LISTEN_ADDRESS: 0.0.0.0:${SECONDBOX_SCENARIO_RELOCATION_RUNNER_DATA_PLANE_PORT:?SECONDBOX_SCENARIO_RELOCATION_RUNNER_DATA_PLANE_PORT is required}
      SECONDBOX_RUNNER_DATA_PLANE_ADVERTISED_ADDRESS: 127.0.0.1:${SECONDBOX_SCENARIO_RELOCATION_RUNNER_DATA_PLANE_PORT:?SECONDBOX_SCENARIO_RELOCATION_RUNNER_DATA_PLANE_PORT is required}
    volumes:
      - ${SECONDBOX_SCENARIO_RELOCATION_IDENTITY_DIR:?SECONDBOX_SCENARIO_RELOCATION_IDENTITY_DIR is required}:/opt/secondbox-runner-identity:ro
      - ${SECONDBOX_SCENARIO_RELOCATION_STATE_DIR:?SECONDBOX_SCENARIO_RELOCATION_STATE_DIR is required}:/var/lib/secondbox-runner:rshared
      - ${SECONDBOX_SCENARIO_RELOCATION_WORKSPACE_DIR:?SECONDBOX_SCENARIO_RELOCATION_WORKSPACE_DIR is required}:/w:rshared
      - ${SECONDBOX_SCENARIO_MICROSANDBOX_BUILD:?SECONDBOX_SCENARIO_MICROSANDBOX_BUILD is required}:/opt/secondbox-microsandbox:ro
      - ${SECONDBOX_SCENARIO_MICROSANDBOX_MATERIALIZATION:?SECONDBOX_SCENARIO_MICROSANDBOX_MATERIALIZATION is required}:/opt/secondbox-microsandbox-materialization.json:ro
