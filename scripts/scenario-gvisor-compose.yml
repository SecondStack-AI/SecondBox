x-gvisor-environment: &gvisor-environment
  SECONDBOX_GVISOR_RUNSC_PATH: /opt/secondbox-gvisor/bin/runsc
  SECONDBOX_GVISOR_AGENT_PATH: /opt/secondbox-gvisor/bin/secondbox-guest-agent
  SECONDBOX_GVISOR_FLAT_ROOT_PATH: /opt/secondbox-gvisor/rootfs
  SECONDBOX_GVISOR_MATERIALIZATION_PATH: /opt/secondbox-gvisor-materialization.json
  SECONDBOX_GVISOR_MATERIALIZATION_DIGEST: ${SECONDBOX_SCENARIO_GVISOR_MATERIALIZATION_DIGEST:?SECONDBOX_SCENARIO_GVISOR_MATERIALIZATION_DIGEST is required}
  SECONDBOX_GVISOR_RUNTIME_DIR: /run/secondbox-gvisor
  SECONDBOX_GVISOR_MAXIMUM_VCPUS: ${SECONDBOX_SCENARIO_GVISOR_MAXIMUM_VCPUS:?SECONDBOX_SCENARIO_GVISOR_MAXIMUM_VCPUS is required}
  SECONDBOX_GVISOR_MAXIMUM_MEMORY_BYTES: ${SECONDBOX_SCENARIO_GVISOR_MAXIMUM_MEMORY_BYTES:?SECONDBOX_SCENARIO_GVISOR_MAXIMUM_MEMORY_BYTES is required}
  SECONDBOX_GVISOR_MAXIMUM_DISK_BYTES: ${SECONDBOX_SCENARIO_GVISOR_MAXIMUM_DISK_BYTES:?SECONDBOX_SCENARIO_GVISOR_MAXIMUM_DISK_BYTES is required}
  SECONDBOX_GVISOR_MAXIMUM_INSTANCES: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_GLOBAL:?SECONDBOX_SCENARIO_MAX_CONCURRENT_GLOBAL is required}
  SECONDBOX_GVISOR_MAXIMUM_OPERATIONS: ${SECONDBOX_SCENARIO_MAX_CONCURRENT_OPERATIONS_GLOBAL:?SECONDBOX_SCENARIO_MAX_CONCURRENT_OPERATIONS_GLOBAL is required}
  SECONDBOX_GVISOR_WORKSPACE_TEMPLATE_CAPACITY_BYTES: ${SECONDBOX_SCENARIO_GVISOR_WORKSPACE_TEMPLATE_CAPACITY_BYTES:?SECONDBOX_SCENARIO_GVISOR_WORKSPACE_TEMPLATE_CAPACITY_BYTES is required}

services:
  secondbox-runner:
    environment: *gvisor-environment
    # A privileged container reaches every host device it needs (loop
    # control, loop devices); the base service's explicit KVM and TUN device
    # bindings would fail on the no-KVM hosts this backend qualifies.
    devices: !reset []
    volumes:
      - ${SECONDBOX_SCENARIO_GVISOR_BUILD:?SECONDBOX_SCENARIO_GVISOR_BUILD is required}:/opt/secondbox-gvisor:ro
      - ${SECONDBOX_SCENARIO_GVISOR_MATERIALIZATION:?SECONDBOX_SCENARIO_GVISOR_MATERIALIZATION is required}:/opt/secondbox-gvisor-materialization.json:ro

  secondbox-runner-relocation:
    extends:
      file: ./scenario-compose.yml
      service: secondbox-runner
    profiles: ["relocation"]
    restart: "no"
    labels:
      org.secondbox.runner.qualification: scenario-relocation-target
    devices: !reset []
    environment:
      <<: *gvisor-environment
      # Both runner containers share the host network namespace; a distinct
      # profile gives this one its own DNS proxy address, slot space, and
      # link names.
      SECONDBOX_GVISOR_NETWORK_PROFILE: "1"
      SECONDBOX_RUNNER_ID: ${SECONDBOX_SCENARIO_RELOCATION_RUNNER_ID:?SECONDBOX_SCENARIO_RELOCATION_RUNNER_ID is required}
      SECONDBOX_RUNNER_DATA_PLANE_LISTEN_ADDRESS: 0.0.0.0:${SECONDBOX_SCENARIO_RELOCATION_RUNNER_DATA_PLANE_PORT:?SECONDBOX_SCENARIO_RELOCATION_RUNNER_DATA_PLANE_PORT is required}
      SECONDBOX_RUNNER_DATA_PLANE_ADVERTISED_ADDRESS: 127.0.0.1:${SECONDBOX_SCENARIO_RELOCATION_RUNNER_DATA_PLANE_PORT:?SECONDBOX_SCENARIO_RELOCATION_RUNNER_DATA_PLANE_PORT is required}
    volumes:
      - ${SECONDBOX_SCENARIO_RELOCATION_IDENTITY_DIR:?SECONDBOX_SCENARIO_RELOCATION_IDENTITY_DIR is required}:/opt/secondbox-runner-identity:ro
      - ${SECONDBOX_SCENARIO_RELOCATION_STATE_DIR:?SECONDBOX_SCENARIO_RELOCATION_STATE_DIR is required}:/var/lib/secondbox-runner:rshared
      - ${SECONDBOX_SCENARIO_RELOCATION_WORKSPACE_DIR:?SECONDBOX_SCENARIO_RELOCATION_WORKSPACE_DIR is required}:/w:rshared
      - ${SECONDBOX_SCENARIO_GVISOR_BUILD:?SECONDBOX_SCENARIO_GVISOR_BUILD is required}:/opt/secondbox-gvisor:ro
      - ${SECONDBOX_SCENARIO_GVISOR_MATERIALIZATION:?SECONDBOX_SCENARIO_GVISOR_MATERIALIZATION is required}:/opt/secondbox-gvisor-materialization.json:ro
