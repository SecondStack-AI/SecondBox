name: SecondBox publish locally built candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared SemVer without v
        required: true
        type: string

concurrency:
  group: secondbox-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-local-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - name: Install publication-only tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq skopeo
      - name: Validate immutable tag and successful CI
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          source_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/v${version}^{commit}")" = "$source_commit"
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${source_commit}/check-runs")"
          for required in generated-checks go-tests-vet contract-tests compose-tests image-policy build-artifacts non-kvm-smoke; do
            jq -e --arg name "$required" '.check_runs | any(.name == $name and .status == "completed" and .conclusion == "success")' <<<"$checks" >/dev/null || {
              echo "tagged commit lacks successful required check $required" >&2
              exit 1
            }
          done
      - name: Download private draft transport
        run: |
          set -euo pipefail
          mkdir -p .tmp/publication-input
          gh release download "v${{ inputs.version }}" --dir .tmp/publication-input
          test "$(find .tmp/publication-input -maxdepth 1 -type f -name '*-publication-input.json' | wc -l)" -eq 1
      - name: Publish supplied bytes without rebuilding
        run: scripts/release-hosted-publish.sh publish "${{ inputs.version }}" .tmp/publication-input
      - name: Attest the exact public artifact manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: .tmp/publication-input/secondbox-${{ inputs.version }}-artifact-manifest.json
      - name: Remove private transport and expose incomplete candidate
        run: scripts/release-hosted-publish.sh expose "${{ inputs.version }}" .tmp/publication-input
