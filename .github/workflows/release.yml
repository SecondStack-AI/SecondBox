name: SecondBox publish locally built release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared SemVer without v
        required: true
        type: string

concurrency:
  group: secondbox-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-local-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - name: Install registry client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Download local build
        run: |
          mkdir -p .tmp/release
          gh release download "v${{ inputs.version }}" --dir .tmp/release
      - name: Publish stable release
        run: scripts/release-publish.sh "${{ inputs.version }}" .tmp/release
