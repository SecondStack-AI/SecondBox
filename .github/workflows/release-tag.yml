name: SecondBox release from tag

# A pushed v* tag on main qualifies and stages the release on the self-hosted
# release runners, uploads both artifact sets to a draft, and dispatches the
# hosted publisher (release.yml). A vX.Y.Z-dryrun.N tag stages on both runners
# and uploads nothing. See docs/operations/release-operator-setup.md.
on:
  push:
    tags: ['v[0-9]*']

concurrency:
  group: secondbox-release-tag-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION_TAG: ${{ github.ref_name }}

jobs:
  stage-amd64:
    if: github.repository == 'SecondStack-AI/SecondBox'
    runs-on: [self-hosted, Linux, X64, secondbox-release-amd64]
    timeout-minutes: 300
    outputs:
      output: ${{ steps.paths.outputs.output }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - run: npm ci --ignore-scripts
      - id: paths
        name: Replace an earlier attempt of this version
        run: |
          root="$(set -a; source "${RELEASE_ENV_FILE:-$HOME/.config/secondbox/release.env}"; printf '%s' "$RELEASE_OUTPUT_ROOT")"
          version="${VERSION_TAG#v}"
          rm -rf -- "$root/$version" "$root/$version-build" "$root/$version-candidate"
          echo "output=$root/$version" >>"$GITHUB_OUTPUT"
          echo "logs=$root/logs/$version-${{ github.run_id }}-${{ github.run_attempt }}" >>"$GITHUB_OUTPUT"
      - run: /usr/bin/just release "${VERSION_TAG#v}"
      - name: Keep run logs on the host
        if: always()
        run: |
          mkdir -p "${{ steps.paths.outputs.logs }}"
          for logs in .tmp/release .tmp/qualify; do [[ ! -d "$logs" ]] || cp -a "$logs" "${{ steps.paths.outputs.logs }}/"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amd64-shared-${{ github.ref_name }}
          path: |
            ${{ steps.paths.outputs.output }}/
            !${{ steps.paths.outputs.output }}/*.oci.tar
          if-no-files-found: error
          retention-days: 7

  stage-arm64:
    needs: stage-amd64
    runs-on: [self-hosted, Linux, ARM64, secondbox-release-arm64]
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - run: npm ci --ignore-scripts
      - id: paths
        name: Replace an earlier attempt of this version
        run: |
          root="$(set -a; source "${RELEASE_ENV_FILE:-$HOME/.config/secondbox/release.env}"; printf '%s' "$RELEASE_OUTPUT_ROOT")"
          version="${VERSION_TAG#v}"
          shared="$RUNNER_TEMP/amd64-$version"
          rm -rf -- "$root/$version-arm64" "$shared"
          echo "output=$root/$version-arm64" >>"$GITHUB_OUTPUT"
          echo "shared=$shared" >>"$GITHUB_OUTPUT"
          echo "logs=$root/logs/$version-arm64-${{ github.run_id }}-${{ github.run_attempt }}" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: amd64-shared-${{ github.ref_name }}
          path: ${{ steps.paths.outputs.shared }}
      - run: /usr/bin/just release-arm64 "${VERSION_TAG#v}" "${{ steps.paths.outputs.shared }}"
      - name: Keep run logs on the host
        if: always()
        run: |
          mkdir -p "${{ steps.paths.outputs.logs }}"
          [[ ! -d .tmp/release ]] || cp -a .tmp/release "${{ steps.paths.outputs.logs }}/"
      - if: ${{ !contains(github.ref_name, '-dryrun.') }}
        run: scripts/release-upload.sh "${VERSION_TAG#v}" "${{ steps.paths.outputs.output }}"

  upload-amd64:
    needs: [stage-amd64, stage-arm64]
    if: ${{ !contains(github.ref_name, '-dryrun.') }}
    runs-on: [self-hosted, Linux, X64, secondbox-release-amd64]
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Upload the amd64 set and dispatch the publisher
        run: scripts/release-upload.sh "${VERSION_TAG#v}" "${{ needs.stage-amd64.outputs.output }}"
      - name: Remove intermediate build outputs
        run: rm -rf -- "${{ needs.stage-amd64.outputs.output }}-build" "${{ needs.stage-amd64.outputs.output }}-candidate"
