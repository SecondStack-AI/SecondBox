name: Qualify Packaged SecondBox Release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: Candidate SemVer without a leading v
        required: true
        type: string
      candidate-run-id:
        description: Canonical protected release-candidate workflow run for this exact commit
        required: true
        type: string

permissions: {}

env:
  CI: "true"
  SECONDBOX_RELEASE_VERSION: ${{ inputs.release-version }}
  SECONDBOX_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
  SECONDBOX_RELEASE_GUEST_TRUSTED_PUBLIC_KEY_SHA256: ${{ vars.SECONDBOX_RELEASE_GUEST_TRUSTED_PUBLIC_KEY_SHA256 }}
  SECONDBOX_RELEASE_QUALIFICATION_HOSTS_FILE: ${{ vars.SECONDBOX_RELEASE_QUALIFICATION_HOSTS_FILE }}
  SECONDBOX_RELEASE_QUALIFICATION_CONTROLLER_DIRECTORY: ${{ vars.SECONDBOX_RELEASE_QUALIFICATION_CONTROLLER_DIRECTORY }}
  SECONDBOX_MULTIRUNNER_QUALIFIED_DEPLOYMENT: ${{ vars.SECONDBOX_MULTIRUNNER_QUALIFIED_DEPLOYMENT }}
  SECONDBOX_MULTIRUNNER_API_URL: ${{ vars.SECONDBOX_MULTIRUNNER_API_URL }}
  SECONDBOX_MULTIRUNNER_PROFILE: ${{ vars.SECONDBOX_MULTIRUNNER_PROFILE }}
  SECONDBOX_MULTIRUNNER_POOL: ${{ vars.SECONDBOX_MULTIRUNNER_POOL }}
  SECONDBOX_MULTIRUNNER_RUNNER_A_ID: ${{ vars.SECONDBOX_MULTIRUNNER_RUNNER_A_ID }}
  SECONDBOX_MULTIRUNNER_RUNNER_B_ID: ${{ vars.SECONDBOX_MULTIRUNNER_RUNNER_B_ID }}
  SECONDBOX_MULTIRUNNER_HOST_A_ID: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_A_ID }}
  SECONDBOX_MULTIRUNNER_HOST_B_ID: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_B_ID }}
  SECONDBOX_MULTIRUNNER_HOST_A_SSH: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_A_SSH }}
  SECONDBOX_MULTIRUNNER_HOST_B_SSH: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_B_SSH }}
  SECONDBOX_MULTIRUNNER_HOST_A_SERVICE: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_A_SERVICE }}
  SECONDBOX_MULTIRUNNER_HOST_B_SERVICE: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_B_SERVICE }}
  SECONDBOX_MULTIRUNNER_HOST_A_RUNNER_BINARY: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_A_RUNNER_BINARY }}
  SECONDBOX_MULTIRUNNER_HOST_B_RUNNER_BINARY: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_B_RUNNER_BINARY }}
  SECONDBOX_MULTIRUNNER_HOST_A_ENVIRONMENT_FILE: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_A_ENVIRONMENT_FILE }}
  SECONDBOX_MULTIRUNNER_HOST_B_ENVIRONMENT_FILE: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_B_ENVIRONMENT_FILE }}
  SECONDBOX_MULTIRUNNER_HOST_SENTINEL_PATH: ${{ vars.SECONDBOX_MULTIRUNNER_HOST_SENTINEL_PATH }}
  SECONDBOX_MULTIRUNNER_TIMEOUT_SECONDS: ${{ vars.SECONDBOX_MULTIRUNNER_TIMEOUT_SECONDS }}
  SECONDBOX_MULTIRUNNER_PROBE_TIMEOUT_SECONDS: ${{ vars.SECONDBOX_MULTIRUNNER_PROBE_TIMEOUT_SECONDS }}

jobs:
  qualify-packaged-release:
    name: qualify-packaged-release
    environment: release-qualification
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.tmp/release-docker-config
    runs-on:
      group: secondbox-release
      labels: [self-hosted, linux, x64, secondbox-release-qualification]
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out exact protected-main candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Require protected main and explicit qualification source
        run: |
          test "$GITHUB_REPOSITORY" = SecondStack-AI/SecondBox
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SECONDBOX_RELEASE_QUALIFICATION_HOSTS_FILE"
          test "$(realpath -e -- "$SECONDBOX_RELEASE_QUALIFICATION_HOSTS_FILE")" = "$SECONDBOX_RELEASE_QUALIFICATION_HOSTS_FILE"
          test -f "$SECONDBOX_RELEASE_QUALIFICATION_HOSTS_FILE"
          test ! -L "$SECONDBOX_RELEASE_QUALIFICATION_HOSTS_FILE"
          test -n "$SECONDBOX_RELEASE_QUALIFICATION_CONTROLLER_DIRECTORY"
          test "$(realpath -e -- "$SECONDBOX_RELEASE_QUALIFICATION_CONTROLLER_DIRECTORY")" = "$SECONDBOX_RELEASE_QUALIFICATION_CONTROLLER_DIRECTORY"
          test -d "$SECONDBOX_RELEASE_QUALIFICATION_CONTROLLER_DIRECTORY"
          test ! -L "$SECONDBOX_RELEASE_QUALIFICATION_CONTROLLER_DIRECTORY"
      - name: Verify protected qualification environment configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 0755 .tmp/release-qualification
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/environments/release-qualification" \
            >.tmp/release-qualification/protected-environment.json
          node scripts/verify-protected-release-environment.mjs \
            .tmp/release-qualification/protected-environment.json \
            release-qualification
      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Fetch canonical candidate workflow authority
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
        run: |
          install -d -m 0755 .tmp/candidate-authority
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            >.tmp/candidate-authority/run.json
          candidate_run_attempt="$(
            jq -er '.run_attempt' .tmp/candidate-authority/run.json
          )"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$candidate_run_attempt/jobs?per_page=100" \
            --slurp \
            --jq '{
              total_count: ([.[].jobs[]] | length),
              jobs: [.[].jobs[]]
            }' >.tmp/candidate-authority/jobs.json
          test "$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts" \
              --jq "[.artifacts[] | select(.name == \"release-candidate-$GITHUB_SHA\" and .expired == false)] | length"
          )" = 1
      - name: Download exact protected candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate-run-id }}
          name: release-candidate-${{ github.sha }}
          path: .tmp/release-candidate-import
      - name: Verify and import protected candidate
        run: |
          node scripts/verify-protected-release-workflow-run.mjs \
            .tmp/candidate-authority/run.json \
            .tmp/candidate-authority/jobs.json \
            .tmp/release-candidate-import/protected-workflow-identity.json \
            candidate \
            "$SECONDBOX_RELEASE_SOURCE_COMMIT"
          node scripts/verify-protected-release-environment.mjs \
            .tmp/release-candidate-import/protected-environment.json \
            release-candidate
          install -d -m 0755 \
            .tmp/qualification-candidate \
            .tmp/qualification-candidate/guest
          node scripts/import-release-candidate-inputs.mjs \
            .tmp/release-candidate-import \
            .tmp/qualification-candidate \
            "$SECONDBOX_RELEASE_VERSION" \
            "$SECONDBOX_RELEASE_SOURCE_COMMIT" \
            "$GITHUB_ENV"
      - name: Reconstruct and verify the signed guest bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          install -d -m 0700 "$DOCKER_CONFIG"
          printf '%s' "$GITHUB_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          install -d -m 0755 .tmp/qualification-guest-source
          docker pull "$SECONDBOX_RELEASE_GUEST_ARTIFACT_IMAGE"
          guest_container="$(
            docker create "$SECONDBOX_RELEASE_GUEST_ARTIFACT_IMAGE"
          )"
          trap 'docker rm -f -- "$guest_container" >/dev/null' EXIT
          docker cp \
            "$guest_container:/secondbox-runner-microvm/." \
            .tmp/qualification-guest-source/
          docker rm -- "$guest_container" >/dev/null
          trap - EXIT
          SECONDBOX_RELEASE_GUEST_TRUSTED_PUBLIC_KEY=".tmp/qualification-guest-source/signing.pub" \
            scripts/package-release-guest-assets.sh \
              .tmp/qualification-guest-source \
              .tmp/qualification-candidate/guest \
              "$SECONDBOX_RELEASE_VERSION" \
              "$SECONDBOX_RELEASE_SOURCE_COMMIT"
          guest_archive=".tmp/qualification-candidate/guest/secondbox-$SECONDBOX_RELEASE_VERSION-guest-amd64.tar.gz"
          test "$(sha256sum "$guest_archive" | awk '{print $1}')" = \
            "$SECONDBOX_RELEASE_EXPECTED_GUEST_BUNDLE_SHA256"
          test "$(stat -c %s "$guest_archive")" = \
            "$SECONDBOX_RELEASE_EXPECTED_GUEST_BUNDLE_SIZE_BYTES"
      - name: Generate exact candidate subject manifest
        run: |
          node scripts/generate-release-subject-manifest.mjs \
            .tmp/qualification-candidate \
            .tmp/qualification-candidate/release-subjects.json
          jq -e '.status == "passed" and (.subjects | length == 13)' \
            .tmp/qualification-candidate/release-subjects.json >/dev/null
      - name: Execute packaged non-multi-runner qualification
        run: |
          install -d -m 0755 .tmp/qualification-executed
          node scripts/run-packaged-release-qualification.mjs \
            .tmp/qualification-candidate \
            .tmp/qualification-candidate/release-subjects.json \
            "$SECONDBOX_RELEASE_QUALIFICATION_HOSTS_FILE" \
            "$SECONDBOX_RELEASE_QUALIFICATION_CONTROLLER_DIRECTORY" \
            .tmp/qualification-executed \
            kvm \
            durability \
            data-plane \
            network \
            security
      - name: Execute packaged multi-runner qualification
        env:
          SECONDBOX_RELEASE_QUALIFICATION_CANDIDATE_DIRECTORY: ${{ github.workspace }}/.tmp/qualification-candidate
          SECONDBOX_RELEASE_QUALIFICATION_SUBJECT_MANIFEST: ${{ github.workspace }}/.tmp/qualification-candidate/release-subjects.json
          SECONDBOX_RELEASE_QUALIFICATION_OUTPUT_DIRECTORY: ${{ github.workspace }}/.tmp/qualification-executed
          SECONDBOX_MULTIRUNNER_API_TOKEN: ${{ secrets.SECONDBOX_MULTIRUNNER_API_TOKEN }}
          SECONDBOX_MULTIRUNNER_DATABASE_URL: ${{ secrets.SECONDBOX_MULTIRUNNER_DATABASE_URL }}
          SECONDBOX_MULTIRUNNER_SSH_PRIVATE_KEY: ${{ secrets.SECONDBOX_MULTIRUNNER_SSH_PRIVATE_KEY }}
          SECONDBOX_MULTIRUNNER_SSH_KNOWN_HOSTS: ${{ vars.SECONDBOX_MULTIRUNNER_SSH_KNOWN_HOSTS }}
          SECONDBOX_MULTIRUNNER_API_CA_PEM: ${{ vars.SECONDBOX_MULTIRUNNER_API_CA_PEM }}
          SECONDBOX_MULTIRUNNER_CONTROLLER_HOST_ID: ${{ runner.name }}
        run: |
          test -n "$SECONDBOX_MULTIRUNNER_API_TOKEN"
          test -n "$SECONDBOX_MULTIRUNNER_DATABASE_URL"
          test -n "$SECONDBOX_MULTIRUNNER_SSH_PRIVATE_KEY"
          test -n "$SECONDBOX_MULTIRUNNER_SSH_KNOWN_HOSTS"
          test -n "$SECONDBOX_MULTIRUNNER_API_CA_PEM"
          install -d -m 0700 .tmp/multirunner-authority
          identity_file="$GITHUB_WORKSPACE/.tmp/multirunner-authority/id"
          known_hosts_file="$GITHUB_WORKSPACE/.tmp/multirunner-authority/known_hosts"
          api_ca_file="$GITHUB_WORKSPACE/.tmp/multirunner-authority/api-ca.pem"
          cleanup_multirunner_authority() {
            rm -f -- "$identity_file" "$known_hosts_file" "$api_ca_file"
          }
          trap cleanup_multirunner_authority EXIT
          printf '%s\n' "$SECONDBOX_MULTIRUNNER_SSH_PRIVATE_KEY" >"$identity_file"
          printf '%s\n' "$SECONDBOX_MULTIRUNNER_SSH_KNOWN_HOSTS" >"$known_hosts_file"
          printf '%s\n' "$SECONDBOX_MULTIRUNNER_API_CA_PEM" >"$api_ca_file"
          chmod 600 "$identity_file" "$known_hosts_file" "$api_ca_file"
          export SECONDBOX_MULTIRUNNER_SSH_IDENTITY_FILE="$identity_file"
          export SECONDBOX_MULTIRUNNER_SSH_KNOWN_HOSTS_FILE="$known_hosts_file"
          export SECONDBOX_MULTIRUNNER_API_CA_FILE="$api_ca_file"
          scripts/test-multirunner.sh
      - name: Verify every protected qualification record
        run: |
          install -d -m 0755 \
            .tmp/qualification-validation \
            .tmp/release-qualification
          cp \
            .tmp/qualification-candidate/release-subjects.json \
            .tmp/qualification-validation/release-subjects.json
          node scripts/import-release-qualification-evidence.mjs \
            .tmp/qualification-executed \
            .tmp/qualification-validation
          for gate in \
            kvm \
            multi-runner \
            durability \
            data-plane \
            network \
            security; do
            test -f ".tmp/qualification-validation/qualification/$gate.json"
            jq --arg runner_name "$RUNNER_NAME" -e \
              'any(.hosts[]; .id == $runner_name)' \
              ".tmp/qualification-validation/qualification/$gate.json" >/dev/null
          done
          cp -a \
            .tmp/qualification-validation/qualification \
            .tmp/release-qualification/
          node scripts/write-protected-release-workflow-identity.mjs \
            qualification \
            .tmp/release-qualification/protected-workflow-identity.json \
            release-qualification
      - name: Upload canonical protected qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-qualification-${{ github.sha }}
          path: .tmp/release-qualification/
          if-no-files-found: error
          compression-level: 0
      - name: Remove protected qualification workspace material
        if: always()
        run: |
          test -n "$GITHUB_WORKSPACE"
          test "$(pwd)" = "$GITHUB_WORKSPACE"
          rm -rf -- \
            "$GITHUB_WORKSPACE/.tmp/release-docker-config" \
            "$GITHUB_WORKSPACE/.tmp/candidate-authority" \
            "$GITHUB_WORKSPACE/.tmp/qualification-candidate" \
            "$GITHUB_WORKSPACE/.tmp/qualification-executed" \
            "$GITHUB_WORKSPACE/.tmp/qualification-guest-source" \
            "$GITHUB_WORKSPACE/.tmp/qualification-validation" \
            "$GITHUB_WORKSPACE/.tmp/release-candidate-import" \
            "$GITHUB_WORKSPACE/.tmp/release-qualification"
