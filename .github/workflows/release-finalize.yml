name: SecondBox source-free qualification and finalization

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published candidate SemVer without v
        required: true
        type: string

concurrency:
  group: secondbox-release-finalize-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-free-qualification:
    runs-on: [self-hosted, linux, x64, secondbox-kvm]
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SECONDBOX_SOURCE_FREE_OPERATOR_MANIFEST: ${{ vars.SECONDBOX_SOURCE_FREE_OPERATOR_MANIFEST }}
      SECONDBOX_URL: ${{ vars.SECONDBOX_SOURCE_FREE_URL }}
      SECONDBOX_TOKEN: ${{ secrets.SECONDBOX_SOURCE_FREE_TOKEN }}
      SECONDBOX_TENANT_REF: ${{ vars.SECONDBOX_SOURCE_FREE_TENANT_REF }}
      SECONDBOX_SUBJECT_REF: ${{ vars.SECONDBOX_SOURCE_FREE_SUBJECT_REF }}
    steps:
      - name: Download the public qualification suite only
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          base="https://github.com/SecondStack-AI/SecondBox/releases/download/v${RELEASE_VERSION}"
          curl --fail --location --silent --show-error "$base/SHA256SUMS" --output "$RUNNER_TEMP/SHA256SUMS"
          curl --fail --location --silent --show-error "$base/secondbox-${RELEASE_VERSION}-source-free-qualify" --output "$RUNNER_TEMP/secondbox-source-free-qualify"
          expected="$(awk -v name="secondbox-${RELEASE_VERSION}-source-free-qualify" '$2 == name {print $1}' "$RUNNER_TEMP/SHA256SUMS")"
          test -n "$expected"
          echo "$expected  $RUNNER_TEMP/secondbox-source-free-qualify" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/secondbox-source-free-qualify"
      - name: Qualify public candidate without a checkout
        env:
          SECONDBOX_RELEASE_ARTIFACT_MANIFEST_URL: https://github.com/SecondStack-AI/SecondBox/releases/download/v${{ inputs.version }}/secondbox-${{ inputs.version }}-artifact-manifest.json
          SECONDBOX_SOURCE_FREE_ROOT: ${{ runner.temp }}/secondbox-source-free-${{ github.run_id }}-${{ github.run_attempt }}
          SECONDBOX_SOURCE_FREE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/secondbox-source-free-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          SECONDBOX_SOURCE_FREE_QUALIFICATION_OUTPUT: ${{ runner.temp }}/secondbox-${{ inputs.version }}-qualification-attestation.json
        run: |
          set -euo pipefail
          test ! -e "$SECONDBOX_SOURCE_FREE_ROOT"
          mkdir -m 0700 "$SECONDBOX_SOURCE_FREE_ARTIFACT_DIRECTORY"
          "$RUNNER_TEMP/secondbox-source-free-qualify"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secondbox-${{ inputs.version }}-source-free-qualification
          path: ${{ runner.temp }}/secondbox-${{ inputs.version }}-qualification-attestation.json
          if-no-files-found: error
          retention-days: 30

  finalize:
    needs: source-free-qualification
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secondbox-${{ inputs.version }}-source-free-qualification
          path: ${{ runner.temp }}/qualification
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - name: Download public candidate verifier and manifest
        run: |
          set -euo pipefail
          base="https://github.com/SecondStack-AI/SecondBox/releases/download/v${RELEASE_VERSION}"
          curl --fail --location --silent --show-error "$base/SHA256SUMS" --output "$RUNNER_TEMP/SHA256SUMS"
          curl --fail --location --silent --show-error "$base/secondbox-${RELEASE_VERSION}-artifact-manifest.json" --output "$RUNNER_TEMP/artifact-manifest.json"
          curl --fail --location --silent --show-error "$base/secondbox-deploy_${RELEASE_VERSION}_linux_amd64" --output "$RUNNER_TEMP/secondbox-deploy"
          expected="$(awk -v name="secondbox-deploy_${RELEASE_VERSION}_linux_amd64" '$2 == name {print $1}' "$RUNNER_TEMP/SHA256SUMS")"
          echo "$expected  $RUNNER_TEMP/secondbox-deploy" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/secondbox-deploy"
      - name: Construct acyclic final release authority
        run: |
          set -euo pipefail
          qualification="$RUNNER_TEMP/qualification/secondbox-${RELEASE_VERSION}-qualification-attestation.json"
          "$RUNNER_TEMP/secondbox-deploy" release-index --manifest "$RUNNER_TEMP/artifact-manifest.json" --qualification "$qualification" --output "$RUNNER_TEMP/secondbox-${RELEASE_VERSION}-release-index.json"
      - name: Publish qualification, then release index last
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          publish_exact() {
            local asset="$1"
            local name="${asset##*/}"
            local existing="$RUNNER_TEMP/existing-$name"
            if gh release download "$tag" --pattern "$name" --output "$existing" >/dev/null 2>&1; then
              cmp --silent "$asset" "$existing" || { echo "$name already contains different bytes" >&2; exit 1; }
            else
              gh release upload "$tag" "$asset"
            fi
          }
          qualification="$RUNNER_TEMP/qualification/secondbox-${RELEASE_VERSION}-qualification-attestation.json"
          index="$RUNNER_TEMP/secondbox-${RELEASE_VERSION}-release-index.json"
          publish_exact "$qualification"
          curl --fail --location --silent --show-error "https://github.com/SecondStack-AI/SecondBox/releases/download/$tag/${qualification##*/}" | cmp --silent - "$qualification"
          publish_exact "$index"
          curl --fail --location --silent --show-error "https://github.com/SecondStack-AI/SecondBox/releases/download/$tag/${index##*/}" | cmp --silent - "$index"
          "$RUNNER_TEMP/secondbox-deploy" verify release-index "https://github.com/SecondStack-AI/SecondBox/releases/download/$tag/${index##*/}"
          gh release edit "$tag" --prerelease=false
          npm dist-tag add "@secondstack-ai/secondbox@${RELEASE_VERSION}" latest
